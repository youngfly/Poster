<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   Chinese Style Poster — Brand CSS
   东方意境: 朱红、墨色、宣纸、水墨韵味
   ============================================ */

:root {
  /* ── Color System ── */
  --color-primary: #B83B3B;
  --color-primary-light: #D45A5A;
  --color-primary-lighter: #E89595;
  --color-primary-lightest: #F5D5D5;
  --color-primary-dark: #8B2D2D;
  --color-primary-darker: #5C1E1E;
  --color-primary-darkest: #2D1010;

  /* ── Ink / Dark Palette ── */
  --color-ink: #1A1A1A;
  --color-ink-light: #3D3D3D;
  --color-ink-lighter: #6B6B6B;
  --color-ink-lightest: #9E9E9E;

  /* ── Semantic / State Colors ── */
  --state-success: #5B8C5A;
  --state-warning: #C49A3A;
  --state-error: #A85D4A;
  --state-info: #5A7F9F;

  /* ── Surface Palette (Xuan Paper Tones) ── */
  --color-bg-main: #F7F3EB;
  --color-bg-secondary: #F0EBE0;
  --color-bg-tertiary: #E8E1D3;
  --color-bg-elevated: #FAF8F4;
  --color-bg-overlay: rgba(26, 16, 16, 0.6);

  /* ── Gold Accent ── */
  --color-gold: #C49A3A;
  --color-gold-light: #D4AD5E;
  --color-gold-lighter: #E8CFA0;

  /* ── Text Palette ── */
  --color-text-primary: #1A1A1A;
  --color-text-secondary: #3D3D3D;
  --color-text-tertiary: #6B6B6B;
  --color-text-inverse: #F7F3EB;
  --color-text-link: #8B2D2D;

  /* ── Border Palette ── */
  --color-border: #D4C9B0;
  --color-border-subtle: #E2D9CB;
  --color-border-strong: #B83B3B;

  /* ── Typography ── */
  --font-family-display: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", "Songti SC", Georgia, serif;
  --font-family-body: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-family-accent: "Noto Serif SC", "STKaiti", "KaiTi", Georgia, serif;
  --font-family-brush: "Noto Serif SC", "STKaiti", "KaiTi", "Ma Shan Zheng", cursive;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-md: 1.125rem;
  --font-size-lg: 1.25rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;
  --font-size-3xl: 2.5rem;
  --font-size-4xl: 3.25rem;
  --font-size-5xl: 4.5rem;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.2;
  --line-height-snug: 1.35;
  --line-height-normal: 1.6;
  --line-height-relaxed: 1.8;
  --line-height-loose: 2.0;

  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0em;
  --letter-spacing-wide: 0.08em;
  --letter-spacing-wider: 0.15em;
  --letter-spacing-widest: 0.25em;

  /* ── Spacing ── */
  --space-0: 0;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-8: 3rem;
  --space-10: 4rem;
  --color-space-12: 6rem;
  --space-16: 8rem;

  /* ── Radius ── */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-sm: 0 1px 2px rgba(26, 26, 26, 0.04);
  --shadow-md: 0 2px 8px rgba(26, 26, 26, 0.05);
  --shadow-lg: 0 8px 24px rgba(26, 26, 26, 0.05);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-normal: 300ms ease;
  --transition-slow: 500ms ease;
}

/* ── Dark Mode ── */
html.dark {
  --color-primary: #D45A5A;
  --color-primary-light: #B83B3B;
  --color-primary-lighter: #8B2D2D;
  --color-primary-lightest: #5C1E1E;
  --color-primary-dark: #E89595;
  --color-primary-darker: #F5D5D5;
  --color-primary-darkest: #FAECEC;

  --color-bg-main: #141210;
  --color-bg-secondary: #1C1916;
  --color-bg-tertiary: #252118;
  --color-bg-elevated: #181614;
  --color-bg-overlay: rgba(0, 0, 0, 0.7);

  --color-text-primary: #F0EBE0;
  --color-text-secondary: #D4C9B0;
  --color-text-tertiary: #9E9E9E;
  --color-text-inverse: #1A1A1A;
  --color-text-link: #D45A5A;

  --color-border: #4A3D30;
  --color-border-subtle: #3D3228;
  --color-border-strong: #D45A5A;

  --color-gold: #D4AD5E;
  --color-gold-light: #C49A3A;
  --color-gold-lighter: #A07B28;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.18);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>

        <!-- ── Traditional Border Frame (Outer + Inner) ── -->
        <div class="relative min-h-screen" style="padding: 20px;">
            <!-- Outer border -->
            <div class="absolute inset-0 pointer-events-none" style="border: 2px solid var(--color-border);"></div>
            <!-- Inner border -->
            <div class="absolute inset-[8px] pointer-events-none" style="border: 1px solid var(--color-border-strong);"></div>

            <!-- ══════════ HERO SECTION ══════════ -->
            <section class="relative overflow-hidden" style="height: 58vh; min-height: 420px;">
                <!-- Hero ink-wash landscape image -->
                <img
                    src="../assets/hero-chinese-landscape.jpg"
                    alt="水墨山水画"
                    class="absolute inset-0 w-full h-full object-cover"
                    style="filter: saturate(0.7) contrast(1.05);"
                />
                <!-- Ink wash overlay gradient (fades to xuan paper at bottom) -->
                <div class="absolute inset-0" style="background: linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(247, 243, 235, 0) 30%,
                    rgba(247, 243, 235, 0.15) 60%,
                    rgba(247, 243, 235, 0.75) 85%,
                    rgba(247, 243, 235, 1) 100%
                );"></div>

                <!-- Vertical Title: LEFT side -->
                <div class="absolute top-8 left-6 sm:left-10 md:left-14 z-10" style="writing-mode: vertical-rl; font-family: var(--font-family-display); font-size: clamp(2.5rem, 5vw, 4rem); color: var(--color-text-primary); letter-spacing: var(--letter-spacing-widest); line-height: var(--line-height-loose); font-weight: var(--font-weight-bold);">
                    山水清音
                </div>

                <!-- Vertical Subtitle: Below the title -->
                <div class="absolute top-[calc(2.5rem+5vw+6rem)] sm:top-[calc(4rem+80px)] left-10 sm:left-14 md:left-[calc(3.5rem+10px)] z-10" style="writing-mode: vertical-rl; font-family: var(--font-family-accent); font-size: clamp(0.875rem, 1.8vw, 1.125rem); color: var(--color-text-secondary); letter-spacing: var(--letter-spacing-wider); line-height: var(--line-height-loose);">
                    东方意境之美
                </div>

                <!-- Seal Stamp Element (CSS-only, top-right of hero) -->
                <div class="absolute top-12 right-8 sm:right-12 md:right-16 z-10" style="
                    width: 52px;
                    height: 52px;
                    background: var(--color-primary);
                    border: 2px solid var(--color-primary-dark);
                    border-radius: 4px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    transform: rotate(-8deg);
                    font-family: var(--font-family-display);
                    font-size: 1.5rem;
                    font-weight: var(--font-weight-bold);
                    color: var(--color-bg-main);
                    line-height: 1;
                    opacity: 0.88;
                ">韵</div>
            </section>

            <!-- ══════════ POETRY SECTION ══════════ -->
            <section class="relative text-center" style="padding: var(--space-10) var(--space-5);">
                <!-- Decorative horizontal rule with diamond center ornament -->
                <div class="flex items-center justify-center gap-3 mb-8">
                    <div style="flex: 1; max-width: 100px; height: 1px; background: var(--color-border);"></div>
                    <div style="
                        width: 8px;
                        height: 8px;
                        background: var(--color-gold);
                        transform: rotate(45deg);
                        flex-shrink: 0;
                    "></div>
                    <div style="flex: 1; max-width: 100px; height: 1px; background: var(--color-border);"></div>
                </div>

                <!-- Classical Poetry -->
                <div style="
                    font-family: var(--font-family-accent);
                    font-size: clamp(1rem, 2vw, 1.25rem);
                    color: var(--color-text-secondary);
                    line-height: var(--line-height-loose);
                    letter-spacing: var(--letter-spacing-wide);
                    max-width: 480px;
                    margin: 0 auto;
                ">
                    <p>远山如黛近水含烟</p>
                    <p>千帆过尽独钓寒江</p>
                    <p>一壶浊酒相邀明月</p>
                    <p>半卷清风自在人间</p>
                </div>

                <!-- Small decorative rule below poetry -->
                <div class="flex items-center justify-center mt-8">
                    <div style="width: 40px; height: 1px; background: var(--color-border-subtle);"></div>
                </div>
            </section>

            <!-- ══════════ FOUR TREASURES SECTION ══════════ -->
            <section class="text-center" style="padding: var(--space-8) var(--space-5) var(--space-10);">
                <p style="
                    font-family: var(--font-family-accent);
                    font-size: var(--font-size-sm);
                    color: var(--color-ink-lighter);
                    letter-spacing: var(--letter-spacing-wider);
                    margin-bottom: var(--space-4);
                ">文房四宝</p>
                <div class="flex items-center justify-center gap-2 sm:gap-4">
                    <span style="
                        font-family: var(--font-family-display);
                        font-size: var(--font-size-lg);
                        color: var(--color-ink-lighter);
                        letter-spacing: var(--letter-spacing-wider);
                    ">笔</span>
                    <span style="width: 4px; height: 4px; background: var(--color-border); border-radius: 50%; flex-shrink: 0;"></span>
                    <span style="
                        font-family: var(--font-family-display);
                        font-size: var(--font-size-lg);
                        color: var(--color-ink-lighter);
                        letter-spacing: var(--letter-spacing-wider);
                    ">墨</span>
                    <span style="width: 4px; height: 4px; background: var(--color-border); border-radius: 50%; flex-shrink: 0;"></span>
                    <span style="
                        font-family: var(--font-family-display);
                        font-size: var(--font-size-lg);
                        color: var(--color-ink-lighter);
                        letter-spacing: var(--letter-spacing-wider);
                    ">纸</span>
                    <span style="width: 4px; height: 4px; background: var(--color-border); border-radius: 50%; flex-shrink: 0;"></span>
                    <span style="
                        font-family: var(--font-family-display);
                        font-size: var(--font-size-lg);
                        color: var(--color-ink-lighter);
                        letter-spacing: var(--letter-spacing-wider);
                    ">砚</span>
                </div>
            </section>

            <!-- ══════════ FOOTER ══════════ -->
            <footer class="relative" style="padding: var(--space-6) var(--space-5) var(--space-8);">
                <!-- Top thin rule -->
                <div style="height: 1px; background: var(--color-border); margin-bottom: var(--space-6);"></div>

                <div class="flex items-center justify-between">
                    <!-- Left: Small CSS-only circular seal -->
                    <div style="
                        width: 28px;
                        height: 28px;
                        border: 2px solid var(--color-primary);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-family: var(--font-family-display);
                        font-size: var(--font-size-xs);
                        color: var(--color-primary);
                        transform: rotate(-3deg);
                        flex-shrink: 0;
                    ">雅</div>

                    <!-- Center: CSS-only cloud pattern -->
                    <div class="flex items-center gap-1" style="opacity: 0.5;">
                        <div style="
                            width: 20px;
                            height: 12px;
                            background: var(--color-border-subtle);
                            border-radius: 12px 12px 0 0;
                        "></div>
                        <div style="
                            width: 28px;
                            height: 16px;
                            background: var(--color-border-subtle);
                            border-radius: 16px 16px 4px 4px;
                        "></div>
                        <div style="
                            width: 20px;
                            height: 12px;
                            background: var(--color-border-subtle);
                            border-radius: 12px 12px 0 0;
                        "></div>
                    </div>

                    <!-- Right: Traditional year notation -->
                    <span style="
                        font-family: var(--font-family-accent);
                        font-size: var(--font-size-sm);
                        color: var(--color-ink-lighter);
                        letter-spacing: var(--letter-spacing-wide);
                    ">甲辰年</span>
                </div>
            </footer>
        </div>

        <!-- ── Xuan paper texture overlay ── -->
        <div style="
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(212, 201, 176, 0.03) 2px,
                rgba(212, 201, 176, 0.03) 4px
            );
            z-index: 50;
        "></div>

    </main>
    <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
      <style>
        body {
          background: var(--color-bg-main) !important;
          font-family: var(--font-family-body);
        }
      </style>
      <script>lucide.createIcons();</script>
</body>
</html>
