  --color-gold-lighter: #E8CFA0;

  /* ── Text Palette ── */

  --color-text-secondary: #3D3D3D;
  --color-text-tertiary: #6B6B6B;

  /* ── Border Palette ── */

  /* ── Typography ── */

  @theme inline {

  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* ── Slideshow Core ── */
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #0A0A0A;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      .slideshow {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* ── Slide ── */
      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        z-index: 0;
        transition: opacity 1.2s ease-in-out;
      }
      .slide.active {
        opacity: 1;
        z-index: 1;
      }

      /* ── Ken Burns ── */
      @keyframes kenburns {
        from { transform: scale(1.0) translate(0, 0); }
        to   { transform: scale(1.05) translate(-1%, -0.5%); }
      }
      .slide-image {
        position: absolute;
        inset: -5%;
        width: 110%;
        height: 110%;
        object-fit: cover;
        animation: kenburns 20s ease-out forwards;
      }
      .slide.active .slide-image {
        animation-play-state: running;
      }

      /* ── Dark gradient overlay from bottom ── */
      .slide-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.85) 0%,
          rgba(0, 0, 0, 0.4) 40%,
          rgba(0, 0, 0, 0.15) 70%,
          rgba(0, 0, 0, 0.05) 100%
        );
        z-index: 1;
      }

      /* ── Vignette ── */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0, 0, 0, 0.5) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* ── Text content ── */
      .slide-content {
        position: absolute;
        bottom: 120px;
        left: 60px;
        z-index: 3;
        color: #fff;
      }
      .slide-number {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 7rem;
        font-weight: 700;
        line-height: 1;
        opacity: 0.12;
        position: absolute;
        top: -80px;
        left: -10px;
        letter-spacing: -0.03em;
      }
      .slide-title {
        font-family: "Noto Serif SC", "STSong", Georgia, serif;
        font-size: 2.5rem;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }
      .slide-subtitle {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.1rem;
        font-weight: 400;
        font-style: italic;
        letter-spacing: 0.12em;
        opacity: 0.8;
        margin-bottom: 16px;
      }
      .slide-accent-line {
        width: 60px;
        height: 3px;
        transition: background-color 0.6s ease;
      }

      /* ── Progress bar ── */
      .progress-bar-track {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        z-index: 10;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: #D4AD4E;
        transition: width 0.1s linear;
      }
      .progress-bar-fill.animating {
        transition: width 4s linear;
        width: 100% !important;
      }

      /* ── Navigation dots ── */
      .nav-dots {
        position: absolute;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        z-index: 10;
        align-items: center;
      }
      .nav-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: all 0.4s ease;
        border: none;
        outline: none;
        padding: 0;
      }
      .nav-dot:hover {
        background: rgba(255, 255, 255, 0.6);
      }
      .nav-dot.active {
        background: #D4AD4E;
        width: 32px;
        border-radius: 5px;
      }

      /* ── Slide counter ── */
      .slide-counter {
        position: absolute;
        top: 32px;
        right: 40px;
        z-index: 10;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.15em;
      }
      .slide-counter .current {
        color: #D4AD4E;
        font-weight: 700;
      }

      /* ── Play/pause button ── */
      .play-pause-btn {
        position: absolute;
        top: 30px;
        left: 40px;
        z-index: 10;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.3);
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 0;
      }
      .play-pause-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
        color: #fff;
      }
      .play-pause-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      /* ── Title reveal animation ── */
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .slide.active .slide-content {
        animation: fadeSlideUp 0.8s ease-out 0.3s both;
      }
      .slide:not(.active) .slide-content {
        animation: none;
      }
    </style>
</head>

    <script>
    (function() {
        // ── Config ──
        const SLIDE_COUNT = 8;
        const INTERVAL = 4000; // 4 seconds per slide
        const CROSSFADE = 1200; // 1.2s

        // ── DOM References ──
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.nav-dot');
        const progressBar = document.getElementById('progressBar');
        const counterCurrent = document.getElementById('counterCurrent');
        const counterTotal = document.getElementById('counterTotal');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const pauseIcon = document.getElementById('pauseIcon');
        const playIcon = document.getElementById('playIcon');

        // ── State ──
        let currentIndex = 0;
        let isPlaying = true;
        let timer = null;
        let progressRAF = null;
        let progressStart = null;

        // ── Helpers ──
        function pad(n) { return String(n).padStart(2, '0'); }

        function goToSlide(index, resetProgress) {
            if (index < 0) index = SLIDE_COUNT - 1;
            if (index >= SLIDE_COUNT) index = 0;

            slides[currentIndex].classList.remove('active');
            slides[index].classList.add('active');

            dots[currentIndex].classList.remove('active');
            dots[index].classList.add('active');

            currentIndex = index;
            counterCurrent.textContent = pad(currentIndex + 1);

            if (resetProgress !== false) {
                resetProgressTimer();
            }
        }

        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        // ── Progress Bar ──
        function resetProgressTimer() {
            // Reset animation
            progressBar.classList.remove('animating');
            progressBar.style.width = '0%';

            // Force reflow
            void progressBar.offsetWidth;

            if (isPlaying) {
                progressBar.classList.add('animating');
            }

            // Auto advance
            clearTimeout(timer);
            if (isPlaying) {
                timer = setTimeout(nextSlide, INTERVAL);
            }
        }

        function startAutoplay() {
            isPlaying = true;
            pauseIcon.style.display = '';
            playIcon.style.display = 'none';
            playPauseBtn.setAttribute('aria-label', '暂停自动播放');
            resetProgressTimer();
        }

        function stopAutoplay() {
            isPlaying = false;
            pauseIcon.style.display = 'none';
            playIcon.style.display = '';
            playPauseBtn.setAttribute('aria-label', '开始自动播放');
            clearTimeout(timer);
            progressBar.classList.remove('animating');
            // Keep progress at current width
            const computedWidth = progressBar.getBoundingClientRect().width;
            const parentWidth = progressBar.parentElement.getBoundingClientRect().width;
            if (parentWidth > 0) {
                progressBar.style.width = ((computedWidth / parentWidth) * 100) + '%';
            }
        }

        // ── Event Listeners ──

        // Dot navigation
        dots.forEach(function(dot) {
            dot.addEventListener('click', function() {
                const index = parseInt(this.dataset.slide, 10);
                if (index !== currentIndex) {
                    goToSlide(index);
                }
            });
        });

        // Play/pause
        playPauseBtn.addEventListener('click', function() {
            if (isPlaying) {
                stopAutoplay();
            } else {
                startAutoplay();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === ' ') {
                e.preventDefault();
                if (isPlaying) { stopAutoplay(); } else { startAutoplay(); }
            }
        });

        // ── Initialize ──
        counterTotal.textContent = pad(SLIDE_COUNT);
        counterCurrent.textContent = pad(1);
        startAutoplay();
    })();
    </script>
</body>
</html>
