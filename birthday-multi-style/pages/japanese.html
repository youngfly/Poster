<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   Japanese Style Poster — Brand CSS
   侘寂美学: 素雅、留白、自然质感
   ============================================ */

:root {
  /* ── Color System ── */
  --color-primary: #8B7355;
  --color-primary-light: #A89577;
  --color-primary-lighter: #C4B8A4;
  --color-primary-lightest: #E8E0D4;
  --color-primary-dark: #6B5740;
  --color-primary-darker: #4A3B2B;
  --color-primary-darkest: #2D2219;

  /* ── Semantic / State Colors ── */
  --state-success: #6B8F6B;
  --state-warning: #C4A35A;
  --state-error: #A85D4A;
  --state-info: #6B8A9F;

  /* ── Surface Palette ── */
  --color-bg-main: #F5F0E8;
  --color-bg-secondary: #EDE6DA;
  --color-bg-tertiary: #E2D9CB;
  --color-bg-elevated: #FAF7F2;
  --color-bg-overlay: rgba(45, 34, 25, 0.6);

  /* ── Text Palette ── */
  --color-text-primary: #2D2219;
  --color-text-secondary: #5C4F3D;
  --color-text-tertiary: #8B7D6B;
  --color-text-inverse: #F5F0E8;
  --color-text-link: #6B5740;

  /* ── Border Palette ── */
  --color-border: #D4C9B8;
  --color-border-subtle: #E2D9CB;
  --color-border-strong: #A89577;

  /* ── Typography ── */
  --font-family-display: "Noto Serif SC", "Source Han Serif SC", "Yu Mincho", "Hiragino Mincho ProN", Georgia, serif;
  --font-family-body: "Noto Sans SC", "Source Han Sans SC", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-family-accent: "Noto Serif SC", Georgia, serif;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-md: 1.125rem;
  --font-size-lg: 1.25rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;
  --font-size-3xl: 2.5rem;
  --font-size-4xl: 3.25rem;
  --font-size-5xl: 4.5rem;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.2;
  --line-height-snug: 1.35;
  --line-height-normal: 1.6;
  --line-height-relaxed: 1.8;
  --line-height-loose: 2.0;

  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0em;
  --letter-spacing-wide: 0.08em;
  --letter-spacing-wider: 0.15em;
  --letter-spacing-widest: 0.25em;

  /* ── Spacing ── */
  --space-0: 0;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-8: 3rem;
  --space-10: 4rem;
  --space-12: 6rem;
  --space-16: 8rem;

  /* ── Radius ── */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-sm: 0 1px 2px rgba(45, 34, 25, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 34, 25, 0.05);
  --shadow-lg: 0 8px 24px rgba(45, 34, 25, 0.05);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-normal: 300ms ease;
  --transition-slow: 500ms ease;
}

/* ── Dark Mode ── */
html.dark {
  --color-primary: #C4B8A4;
  --color-primary-light: #A89577;
  --color-primary-lighter: #8B7D6B;
  --color-primary-lightest: #6B5740;
  --color-primary-dark: #D4C9B8;
  --color-primary-darker: #E2D9CB;
  --color-primary-darkest: #F5F0E8;

  --color-bg-main: #1A1610;
  --color-bg-secondary: #232017;
  --color-bg-tertiary: #2D2920;
  --color-bg-elevated: #1E1B14;
  --color-bg-overlay: rgba(0, 0, 0, 0.7);

  --color-text-primary: #E8E0D4;
  --color-text-secondary: #C4B8A4;
  --color-text-tertiary: #8B7D6B;
  --color-text-inverse: #2D2219;
  --color-text-link: #D4C9B8;

  --color-border: #4A3B2B;
  --color-border-subtle: #3D3228;
  --color-border-strong: #6B5740;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.18);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      html, body {
        margin: 0; padding: 0;
        min-height: 100vw;
        max-width: 100vw;
      }
      @media (min-width: 563px) {
        body {
          max-width: 562px;
          margin: 0 auto;
          min-height: 1005px;
          box-shadow: 0 0 40px rgba(0,0,0,0.3);
        }
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative overflow-hidden" style="background: var(--color-bg-main); font-family: var(--font-family-body); color: var(--color-text-primary);">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

        <!-- ============ HERO SECTION ============ -->
        <section class="relative" style="height: 350px;">
            <!-- Hero Image with Warm Overlay -->
            <div class="absolute inset-0">
                <img
                    src="../assets/birthday-japanese-v.jpg"
                    alt="Japanese birthday celebration"
                    class="w-full h-full object-cover"
                    style="filter: sepia(0.15) brightness(0.85);"
                >
                <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(245,240,232,0.3) 0%, rgba(245,240,232,0.7) 60%, rgba(245,240,232,1) 100%);"></div>
                <div class="absolute inset-0" style="background: rgba(139,115,85,0.12);"></div>
            </div>

            <!-- Hero Content: Vertical Title on Right -->
            <div class="relative z-10 flex items-center justify-end" style="height: 350px; padding: var(--space-6) var(--space-6);">
                <div class="flex items-end" style="gap: var(--space-8);">
                    <!-- Left decorative element -->
                    <div class="hidden sm:block" style="animation: fadeInUp 1.2s ease-out 0.6s both;">
                        <div style="width: 2px; height: 120px; background: var(--color-primary); opacity: 0.4;"></div>
                    </div>

                    <!-- Right: Vertical Title -->
                    <div class="flex items-end" style="gap: var(--space-8);">
                        <h1
                            class="hero-title"
                            style="
                                writing-mode: vertical-rl;
                                font-family: var(--font-family-display);
                                font-size: clamp(1.5rem, 5vw, 3.25rem);
                                font-weight: var(--font-weight-light);
                                letter-spacing: var(--letter-spacing-widest);
                                color: var(--color-primary-dark);
                                line-height: var(--line-height-loose);
                                animation: fadeInUp 1s ease-out 0.2s both, gentleGlow 4s ease-in-out infinite 1.5s;
                                text-shadow: 0 1px 2px rgba(139,115,85,0.08);
                            "
                        >生日快乐</h1>

                        <!-- Subtitle -->
                        <p
                            class="hero-subtitle hidden sm:block"
                            style="
                                writing-mode: vertical-rl;
                                font-family: var(--font-family-body);
                                font-size: var(--font-size-xs);
                                letter-spacing: var(--letter-spacing-wider);
                                color: var(--color-text-tertiary);
                                font-weight: var(--font-weight-light);
                                animation: fadeInUp 1s ease-out 0.8s both;
                            "
                        >Wabi-Sabi Birthday</p>
                    </div>
                </div>
            </div>

            <!-- Cherry Blossom Petals (CSS-only) -->
            <div class="petal petal-1" aria-hidden="true"></div>
            <div class="petal petal-2" aria-hidden="true"></div>
            <div class="petal petal-3" aria-hidden="true"></div>
            <div class="petal petal-4" aria-hidden="true"></div>
        </section>

        <!-- ============ DECORATIVE RULE ============ -->
        <div class="flex items-center" style="padding: var(--space-4) var(--space-6); animation: fadeInUp 1s ease-out 1s both;">
            <div class="flex-1" style="height: 1px; background: var(--color-border);"></div>
            <div style="padding: 0 var(--space-4);">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="8" cy="8" r="3" stroke="var(--color-primary-lighter)" stroke-width="0.8" fill="none"/>
                    <circle cx="8" cy="8" r="1" fill="var(--color-primary-lighter)"/>
                </svg>
            </div>
            <div class="flex-1" style="height: 1px; background: var(--color-border);"></div>
        </div>

        <!-- ============ ZEN MESSAGE SECTION ============ -->
        <section class="relative" style="padding: var(--space-6) var(--space-6) var(--space-8); animation: fadeInUp 1s ease-out 1.2s both;">
            <div class="mx-auto" style="max-width: 540px;">

                <!-- Zen Poem -->
                <div class="zen-message" style="
                    font-family: var(--font-family-display);
                    font-size: var(--font-size-lg);
                    font-weight: var(--font-weight-light);
                    line-height: var(--line-height-loose);
                    letter-spacing: var(--letter-spacing-wide);
                    color: var(--color-text-secondary);
                    text-align: center;
                    padding: var(--space-6) 0;
                ">
                    <p style="margin-bottom: var(--space-4);">岁月如歌，静好如初。</p>
                    <p style="margin-bottom: var(--space-4);">愿此日之光，温暖永恒。</p>
                    <p style="color: var(--color-primary); font-weight: var(--font-weight-regular); font-size: var(--font-size-md); margin-top: var(--space-4);">生日快乐。</p>
                </div>

                <!-- Subtle Rule -->
                <div style="height: 1px; background: var(--color-border-subtle); margin: var(--space-5) auto; max-width: 80px;"></div>

                <!-- Wabi-Sabi philosophy note -->
                <p class="zen-note" style="
                    font-family: var(--font-family-body);
                    font-size: var(--font-size-xs);
                    color: var(--color-text-tertiary);
                    text-align: center;
                    letter-spacing: var(--letter-spacing-wide);
                    font-weight: var(--font-weight-light);
                    line-height: var(--line-height-relaxed);
                    animation: fadeInUp 1s ease-out 1.6s both;
                ">侘寂之美，在于不完美中的完美</p>
            </div>
        </section>

        <!-- ============ FOOTER ============ -->
        <footer style="
            padding: var(--space-6) var(--space-6);
            text-align: center;
            animation: fadeInUp 1s ease-out 1.8s both;
        ">
            <!-- CSS Seal Stamp Circle -->
            <div class="seal-stamp mx-auto" style="
                width: 64px;
                height: 64px;
                border: 2px solid var(--color-primary);
                border-radius: var(--radius-full);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-family: var(--font-family-display);
                font-size: var(--font-size-2xl);
                font-weight: var(--font-weight-semibold);
                color: var(--color-primary);
                letter-spacing: var(--letter-spacing-normal);
                opacity: 0.85;
                transform: rotate(-8deg);
                transition: transform var(--transition-normal);
            ">祝</div>
        </footer>

        <!-- ============ INLINE STYLES (before </body>) ============ -->
        <style>
            /* ── Cherry Blossom Petals ── */
            .petal {
                position: absolute;
                width: 12px;
                height: 12px;
                border-radius: 50% 0 50% 50%;
                opacity: 0.6;
                pointer-events: none;
                z-index: 5;
            }

            .petal-1 {
                top: 15%;
                left: 10%;
                background: var(--color-primary-lighter, #C4B8A4);
                animation: floatPetal 6s ease-in-out infinite;
            }
            .petal-1::before {
                content: '';
                position: absolute;
                top: -4px;
                left: 2px;
                width: 8px;
                height: 8px;
                border-radius: 50% 0 50% 50%;
                background: var(--color-primary-lighter, #C4B8A4);
                opacity: 0.5;
                transform: rotate(45deg);
                animation: floatPetal 8s ease-in-out 1s infinite;
            }

            .petal-2 {
                top: 25%;
                right: 18%;
                width: 10px;
                height: 10px;
                background: var(--color-primary-light, #A89577);
                animation: floatPetal 7s ease-in-out 1.5s infinite;
            }
            .petal-2::after {
                content: '';
                position: absolute;
                top: 3px;
                right: -5px;
                width: 7px;
                height: 7px;
                border-radius: 50% 0 50% 50%;
                background: var(--color-primary-light, #A89577);
                opacity: 0.4;
                transform: rotate(-30deg);
                animation: floatPetal 9s ease-in-out 0.5s infinite;
            }

            .petal-3 {
                top: 40%;
                left: 22%;
                width: 8px;
                height: 8px;
                background: var(--color-primary-lightest, #E8E0D4);
                animation: floatPetal 5s ease-in-out 2s infinite;
            }
            .petal-3::before {
                content: '';
                position: absolute;
                top: -3px;
                left: 1px;
                width: 6px;
                height: 6px;
                border-radius: 50% 0 50% 50%;
                background: var(--color-primary-lightest, #E8E0D4);
                opacity: 0.5;
                transform: rotate(60deg);
                animation: floatPetal 7s ease-in-out 1.2s infinite;
            }

            .petal-4 {
                top: 10%;
                left: 50%;
                width: 9px;
                height: 9px;
                background: var(--color-primary-lighter, #C4B8A4);
                animation: floatPetal 8s ease-in-out 0.8s infinite;
            }
            .petal-4::after {
                content: '';
                position: absolute;
                bottom: -4px;
                right: 1px;
                width: 6px;
                height: 6px;
                border-radius: 50% 0 50% 50%;
                background: var(--color-primary-lighter, #C4B8A4);
                opacity: 0.45;
                transform: rotate(120deg);
                animation: floatPetal 6s ease-in-out 2.5s infinite;
            }

            /* ── Keyframe Animations ── */
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes floatPetal {
                0% {
                    transform: translateY(-10px) rotate(0deg);
                    opacity: 0.7;
                }
                50% {
                    transform: translateY(20px) rotate(180deg);
                    opacity: 0.4;
                }
                100% {
                    transform: translateY(-10px) rotate(360deg);
                    opacity: 0.7;
                }
            }

            @keyframes gentleGlow {
                0%, 100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.85;
                }
            }

            /* ── Seal Stamp Hover ── */
            .seal-stamp:hover {
                transform: rotate(0deg) scale(1.05);
                opacity: 1;
            }

            /* ── Reduced Motion ── */
            @media (prefers-reduced-motion: reduce) {
                .petal,
                .petal::before,
                .petal::after,
                .hero-title,
                .hero-subtitle,
                .zen-message,
                .zen-note {
                    animation: none !important;
                    opacity: 1 !important;
                }
            }
        </style>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
