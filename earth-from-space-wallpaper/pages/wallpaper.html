<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空地球壁纸</title>
    <style id="theme-vars">
:root {
  --space-black: #0a0a1a;
  --space-deep: #000000;
  --earth-glow: rgba(26, 58, 92, 0.35);
  --earth-glow-strong: rgba(26, 58, 92, 0.6);
  --star-accent: #fff5e6;
  --text-subtle: rgba(255, 255, 255, 0.3);
  --atmosphere-blue: rgba(70, 130, 200, 0.15);
  --sunlight-gold: rgba(255, 210, 120, 0.08);
  --sunlight-edge: rgba(255, 200, 100, 0.12);
  --color-primary: #1a3a5c;
  --color-primary-light: #2a5a8c;
  --color-primary-dark: #0a1a2c;
  --color-foreground: #e8edf2;
  --color-foreground-muted: rgba(232, 237, 242, 0.6);
  --color-background: #0a0a1a;
  --color-surface: #111827;
  --color-surface-elevated: #1a2332;
  --color-border: rgba(255, 255, 255, 0.08);
  --state-success: #22c55e;
  --state-warning: #eab308;
  --state-error: #ef4444;
  --state-info: #3b82f6;
  --radius-sm: 2px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-space-background: var(--color-background);
    --color-space-foreground: var(--color-foreground);
    --color-space-primary: var(--color-primary);
    --color-space-surface: var(--color-surface);
    --color-space-border: var(--color-border);
  }

  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative w-full min-h-screen overflow-hidden" style="background: linear-gradient(180deg, var(--space-deep) 0%, var(--space-black) 40%, #050510 100%);">

        <!-- Starfield background base layer -->
        <div class="absolute inset-0 starfield-layer" aria-hidden="true">
            <img src="../assets/starfield-background.jpg" alt="" class="w-full h-full object-cover" style="opacity: 0.9;">
        </div>

        <!-- Generated star layers for twinkling depth -->
        <div class="absolute inset-0" aria-hidden="true" id="stars-container">
            <div class="stars stars-small"></div>
            <div class="stars stars-medium"></div>
            <div class="stars stars-large"></div>
        </div>

        <!-- Deep space vignette overlay -->
        <div class="absolute inset-0" aria-hidden="true" style="background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 80%, rgba(0,0,0,0.95) 100%);"></div>

        <!-- Earth composition -->
        <div class="absolute inset-0 flex items-center justify-center" aria-hidden="true">
            <!-- Outer atmospheric glow (multiple layers for realism) -->
            <div class="earth-glow-layer earth-glow-outer"></div>
            <div class="earth-glow-layer earth-glow-mid"></div>
            <div class="earth-glow-layer earth-glow-inner"></div>

            <!-- Sunlight wash (upper-left golden illumination) -->
            <div class="absolute" style="width: 70vmin; height: 70vmin; background: radial-gradient(ellipse at 30% 25%, rgba(255,210,120,0.06) 0%, transparent 60%); pointer-events: none;"></div>

            <!-- Earth main image -->
            <div class="earth-container">
                <img src="../assets/earth-wallpaper-hero.jpg" alt="Earth from space" class="earth-image">
                <!-- Limb brightening overlay -->
                <div class="absolute inset-0 rounded-full" style="box-shadow: inset -8px -4px 30px rgba(70,130,200,0.15), inset 4px 2px 20px rgba(255,200,100,0.08); pointer-events: none;"></div>
                <!-- Atmospheric rim glow -->
                <div class="absolute rounded-full atmospheric-rim"></div>
            </div>
        </div>

        <!-- Spacecraft window frame effect -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true" style="border: 1px solid rgba(255,255,255,0.03); box-shadow: inset 0 0 120px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);"></div>

        <!-- Subtle lens flare accent (upper left) -->
        <div class="absolute pointer-events-none" aria-hidden="true" style="top: 8%; left: 12%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,220,150,0.04) 0%, transparent 70%);"></div>

        <!-- "Pale Blue Dot" watermark text -->
        <div class="absolute bottom-8 left-0 right-0 flex justify-center pointer-events-none">
            <p class="watermark-text" style="font-family: 'Georgia', 'Times New Roman', serif; color: var(--text-subtle); font-size: clamp(14px, 1.5vw, 22px); letter-spacing: 0.35em; text-transform: uppercase; font-weight: 300; opacity: 0.3;">
                Pale Blue Dot
            </p>
        </div>

        <!-- Secondary subtle text -->
        <div class="absolute bottom-16 left-0 right-0 flex justify-center pointer-events-none">
            <p style="font-family: 'Georgia', 'Times New Roman', serif; color: var(--text-subtle); font-size: clamp(10px, 0.8vw, 13px); letter-spacing: 0.2em; opacity: 0.15; font-weight: 300;">
                Carl Sagan, 1990
            </p>
        </div>

    </main>

    <!-- Custom CSS for wallpaper composition (placed before </body> per rules) -->
    <style>
        /* ========== STAR TWINKLE ANIMATION ========== */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .stars-small {
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 25% 65%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 40% 10%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1px 1px at 55% 80%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 70% 35%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 85% 90%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 15% 85%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 60% 45%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 90% 15%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1px 1px at 35% 55%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 5% 50%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 78% 70%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 48% 92%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 22% 38%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 95% 55%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1px 1px at 32% 75%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 68% 8%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 52% 28%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 82% 48%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1px 1px at 12% 95%, rgba(255,245,230,0.3), transparent);
            animation: twinkle-slow 8s ease-in-out infinite alternate;
        }

        .stars-medium {
            background-image:
                radial-gradient(1.5px 1.5px at 18% 30%, rgba(255,245,230,0.7), transparent),
                radial-gradient(1.5px 1.5px at 45% 72%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1.5px 1.5px at 72% 18%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1.5px 1.5px at 88% 62%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1.5px 1.5px at 8% 78%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1.5px 1.5px at 58% 12%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1.5px 1.5px at 33% 88%, rgba(255,245,230,0.7), transparent),
                radial-gradient(1.5px 1.5px at 92% 42%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1.5px 1.5px at 65% 55%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1.5px 1.5px at 42% 38%, rgba(255,245,230,0.5), transparent);
            animation: twinkle-medium 12s ease-in-out infinite alternate;
        }

        .stars-large {
            background-image:
                radial-gradient(2px 2px at 20% 15%, rgba(255,245,230,0.9), transparent),
                radial-gradient(2px 2px at 75% 85%, rgba(255,245,230,0.8), transparent),
                radial-gradient(2px 2px at 50% 50%, rgba(255,245,230,0.7), transparent),
                radial-gradient(2.5px 2.5px at 90% 25%, rgba(255,220,180,0.9), transparent),
                radial-gradient(2px 2px at 10% 60%, rgba(255,245,230,0.6), transparent);
            animation: twinkle-fast 6s ease-in-out infinite alternate;
        }

        @keyframes twinkle-slow {
            0% { opacity: 0.5; }
            50% { opacity: 0.8; }
            100% { opacity: 0.6; }
        }

        @keyframes twinkle-medium {
            0% { opacity: 0.4; }
            50% { opacity: 0.9; }
            100% { opacity: 0.5; }
        }

        @keyframes twinkle-fast {
            0% { opacity: 0.3; }
            33% { opacity: 1; }
            66% { opacity: 0.6; }
            100% { opacity: 0.8; }
        }

        /* ========== EARTH GLOW LAYERS ========== */
        .earth-glow-layer {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .earth-glow-outer {
            width: 62vmin;
            height: 62vmin;
            background: radial-gradient(circle, var(--earth-glow) 30%, transparent 70%);
            animation: atmospheric-pulse-outer 12s ease-in-out infinite;
        }

        .earth-glow-mid {
            width: 56vmin;
            height: 56vmin;
            background: radial-gradient(circle, var(--atmosphere-blue) 25%, transparent 65%);
            animation: atmospheric-pulse-mid 8s ease-in-out infinite;
        }

        .earth-glow-inner {
            width: 52vmin;
            height: 52vmin;
            background: radial-gradient(circle, rgba(100,170,230,0.1) 20%, transparent 60%);
            animation: atmospheric-pulse-inner 6s ease-in-out infinite;
        }

        @keyframes atmospheric-pulse-outer {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        @keyframes atmospheric-pulse-mid {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }

        @keyframes atmospheric-pulse-inner {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.01); opacity: 0.8; }
        }

        /* ========== EARTH IMAGE ========== */
        .earth-container {
            position: relative;
            width: 50vmin;
            height: 50vmin;
        }

        .earth-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            filter: saturate(1.1) contrast(1.05);
            box-shadow:
                0 0 60px rgba(26,58,92,0.4),
                0 0 120px rgba(26,58,92,0.2),
                0 0 200px rgba(26,58,92,0.1);
        }

        /* ========== ATMOSPHERIC RIM ========== */
        .atmospheric-rim {
            top: -3%;
            left: -3%;
            width: 106%;
            height: 106%;
            border: 2px solid rgba(100,170,230,0.08);
            box-shadow:
                0 0 20px rgba(100,170,230,0.1),
                0 0 40px rgba(70,130,200,0.06),
                inset 0 0 20px rgba(100,170,230,0.05);
            animation: rim-glow 10s ease-in-out infinite;
        }

        @keyframes rim-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ========== WATERMARK TEXT ========== */
        .watermark-text {
            animation: text-breathe 15s ease-in-out infinite;
        }

        @keyframes text-breathe {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.35; }
        }

        /* ========== REDUCED MOTION ========== */
        @media (prefers-reduced-motion: reduce) {
            .stars-small,
            .stars-medium,
            .stars-large,
            .earth-glow-outer,
            .earth-glow-mid,
            .earth-glow-inner,
            .atmospheric-rim,
            .watermark-text {
                animation: none;
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 640px) {
            .earth-container {
                width: 70vmin;
                height: 70vmin;
            }
            .earth-glow-outer {
                width: 80vmin;
                height: 80vmin;
            }
            .earth-glow-mid {
                width: 74vmin;
                height: 74vmin;
            }
            .earth-glow-inner {
                width: 68vmin;
                height: 68vmin;
            }
        }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
