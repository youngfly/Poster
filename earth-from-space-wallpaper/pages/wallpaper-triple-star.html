<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三星系统壁纸</title>
    <style id="theme-vars">
:root {
  --star-blue: #8cb4e0;
  --star-gold: #e8b84a;
  --star-orange: #d4724a;
  --stellar-glow: rgba(140, 180, 224, 0.15);
  --nebula-purple: rgba(88, 28, 135, 0.08);
  --color-primary: #1a3a5c;
  --color-primary-light: #2a5a8c;
  --color-primary-dark: #0a1a2c;
  --color-foreground: #e8edf2;
  --color-foreground-muted: rgba(232, 237, 242, 0.6);
  --color-background: #0a0a1a;
  --color-surface: #111827;
  --color-surface-elevated: #1a2332;
  --color-border: rgba(255, 255, 255, 0.08);
  --state-success: #22c55e;
  --state-warning: #eab308;
  --state-error: #ef4444;
  --state-info: #3b82f6;
  --radius-sm: 2px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-space-background: var(--color-background);
    --color-space-foreground: var(--color-foreground);
    --color-space-primary: var(--color-primary);
    --color-space-surface: var(--color-surface);
    --color-space-border: var(--color-border);
  }

  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative w-full min-h-screen overflow-hidden">

        <!-- Triple star system hero image — full viewport background -->
        <div class="absolute inset-0" aria-hidden="true">
            <img src="../assets/triple-star-system.jpg" alt="" class="w-full h-full object-cover" style="object-position: center;">
        </div>

        <!-- Subtle CSS-generated faint background stars -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
            <div class="stars-dim"></div>
            <div class="stars-dim-alt"></div>
        </div>

        <!-- Radial glow overlay — raw cosmic energy from the three suns -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true" id="stellar-glow"></div>

        <!-- Vignette — edges fade into deep darkness -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true" style="background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.85) 100%);"></div>

        <!-- Watermark text at bottom -->
        <div class="absolute bottom-12 left-0 right-0 flex flex-col items-center pointer-events-none">
            <p class="watermark-title" style="font-family: var(--font-body); color: rgba(200, 215, 240, 0.2); font-size: clamp(28px, 3.5vw, 52px); font-weight: 200; letter-spacing: 0.5em; margin-bottom: 4px;">
                三体
            </p>
            <p class="watermark-subtitle" style="font-family: var(--font-body); color: rgba(200, 215, 240, 0.2); font-size: clamp(10px, 1.2vw, 16px); font-weight: 300; letter-spacing: 0.4em; text-transform: uppercase;">
                The three-body problem
            </p>
        </div>

    </main>

    <!-- Custom styles — placed before </body> per rules -->
    <style>
        /* ========== CUSTOM :ROOT VARIABLES ========== */
        :root {
            --star-blue: #8cb4e0;
            --star-gold: #e8b84a;
            --star-orange: #d4724a;
            --stellar-glow: rgba(140, 180, 224, 0.15);
            --nebula-purple: rgba(88, 28, 135, 0.08);
        }

        /* ========== FAINT BACKGROUND STARS ========== */
        .stars-dim {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(1px 1px at 8% 15%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1px 1px at 22% 42%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 37% 78%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 51% 22%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1px 1px at 64% 88%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1px 1px at 79% 35%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 93% 62%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 14% 92%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1px 1px at 45% 55%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 88% 8%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1px 1px at 3% 58%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 72% 48%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1px 1px at 28% 5%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 56% 68%, rgba(255,255,255,0.2), transparent);
            animation: twinkle-dim 10s ease-in-out infinite alternate;
        }

        .stars-dim-alt {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(1.5px 1.5px at 17% 28%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1.5px 1.5px at 42% 72%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1.5px 1.5px at 68% 18%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1.5px 1.5px at 83% 52%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1.5px 1.5px at 6% 82%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1.5px 1.5px at 95% 38%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1.5px 1.5px at 33% 45%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1.5px 1.5px at 58% 92%, rgba(255,255,255,0.15), transparent);
            animation: twinkle-dim-alt 14s ease-in-out infinite alternate;
        }

        @keyframes twinkle-dim {
            0% { opacity: 0.4; }
            50% { opacity: 0.7; }
            100% { opacity: 0.5; }
        }

        @keyframes twinkle-dim-alt {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.4; }
        }

        /* ========== STELLAR GLOW OVERLAY — breathing pulse ========== */
        #stellar-glow {
            background:
                radial-gradient(ellipse at 50% 45%, rgba(140, 180, 224, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 45% 48%, rgba(232, 184, 74, 0.08) 0%, transparent 35%),
                radial-gradient(ellipse at 55% 42%, rgba(212, 114, 74, 0.07) 0%, transparent 30%),
                radial-gradient(ellipse at 50% 45%, var(--nebula-purple) 0%, transparent 55%);
            animation: stellar-pulse 8s ease-in-out infinite;
        }

        @keyframes stellar-pulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* ========== WATERMARK TEXT — slow breathing ========== */
        .watermark-title {
            animation: watermark-breathe 12s ease-in-out infinite;
        }

        .watermark-subtitle {
            animation: watermark-breathe 12s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes watermark-breathe {
            0%, 100% { opacity: 0.12; }
            50% { opacity: 0.25; }
        }

        /* ========== REDUCED MOTION ========== */
        @media (prefers-reduced-motion: reduce) {
            .stars-dim,
            .stars-dim-alt,
            #stellar-glow,
            .watermark-title,
            .watermark-subtitle {
                animation: none !important;
            }
            .watermark-title,
            .watermark-subtitle {
                opacity: 0.2;
            }
        }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
