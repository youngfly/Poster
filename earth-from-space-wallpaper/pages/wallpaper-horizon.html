<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地平线壁纸</title>
    <style id="theme-vars">
:root {
  --space-black: #0a0a1a;
  --space-deep: #000000;
  --earth-glow: rgba(26, 58, 92, 0.35);
  --earth-glow-strong: rgba(26, 58, 92, 0.6);
  --star-accent: #fff5e6;
  --text-subtle: rgba(255, 255, 255, 0.3);
  --atmosphere-blue: rgba(70, 130, 200, 0.15);
  --sunlight-gold: rgba(255, 210, 120, 0.08);
  --sunlight-edge: rgba(255, 200, 100, 0.12);
  --atmo-glow-line: rgba(100, 170, 230, 0.6);
  --color-primary: #1a3a5c;
  --color-primary-light: #2a5a8c;
  --color-primary-dark: #0a1a2c;
  --color-foreground: #e8edf2;
  --color-foreground-muted: rgba(232, 237, 242, 0.6);
  --color-background: #0a0a1a;
  --color-surface: #111827;
  --color-surface-elevated: #1a2332;
  --color-border: rgba(255, 255, 255, 0.08);
  --state-success: #22c55e;
  --state-warning: #eab308;
  --state-error: #ef4444;
  --state-info: #3b82f6;
  --radius-sm: 2px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-space-background: var(--color-background);
    --color-space-foreground: var(--color-foreground);
    --color-space-primary: var(--color-primary);
    --color-space-surface: var(--color-surface);
    --color-space-border: var(--color-border);
  }

  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative w-full min-h-screen overflow-hidden" style="background: var(--space-deep);">

        <!-- Starfield background base layer (full viewport) -->
        <div class="absolute inset-0" aria-hidden="true">
            <img src="../assets/starfield-background.jpg" alt="" class="w-full h-full object-cover" style="opacity: 0.85;">
        </div>

        <!-- Upper space: pure black overlay to deepen the top 60% -->
        <div class="absolute inset-0" aria-hidden="true" style="background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.5) 45%, rgba(0,0,0,0) 75%);"></div>

        <!-- Generated star layers for twinkling (visible mainly in upper space) -->
        <div class="absolute inset-0" aria-hidden="true" id="stars-container">
            <div class="horizon-stars horizon-stars-small"></div>
            <div class="horizon-stars horizon-stars-medium"></div>
            <div class="horizon-stars horizon-stars-large"></div>
        </div>

        <!-- Earth horizon image — positioned at bottom, covering bottom ~38% -->
        <div class="absolute left-0 right-0 bottom-0" style="height: 42vh;" aria-hidden="true">
            <img src="../assets/earth-horizon.jpg" alt="Earth's curved horizon from low orbit"
                 class="w-full h-full object-cover"
                 style="object-position: bottom center; filter: saturate(1.15) contrast(1.05);">
            <!-- Subtle color grade: warm sunlight on right, cool night on left -->
            <div class="absolute inset-0" style="background: linear-gradient(90deg, rgba(0,0,20,0.25) 0%, transparent 40%, rgba(255,210,120,0.04) 80%, rgba(255,200,100,0.06) 100%);"></div>
        </div>

        <!-- Thin atmospheric glow line at the space-Earth boundary -->
        <div class="absolute left-0 right-0 pointer-events-none" aria-hidden="true" style="bottom: 40vh; height: 3px;">
            <div class="absolute inset-0" style="background: linear-gradient(90deg, transparent 0%, rgba(70,140,220,0.15) 15%, rgba(100,170,240,0.5) 35%, rgba(120,185,255,0.7) 50%, rgba(100,170,240,0.5) 65%, rgba(70,140,220,0.15) 85%, transparent 100%); filter: blur(1px);"></div>
            <!-- Wider soft glow behind the thin line -->
            <div class="absolute pointer-events-none" style="bottom: -6px; left: 0; right: 0; height: 15px; background: linear-gradient(90deg, transparent 0%, rgba(70,140,220,0.06) 15%, rgba(100,170,240,0.18) 50%, rgba(70,140,220,0.06) 85%, transparent 100%); filter: blur(4px);"></div>
            <!-- Broad atmospheric haze -->
            <div class="absolute pointer-events-none" style="bottom: -20px; left: 0; right: 0; height: 50px; background: linear-gradient(90deg, transparent 0%, rgba(60,120,200,0.04) 20%, rgba(80,150,230,0.1) 50%, rgba(60,120,200,0.04) 80%, transparent 100%); filter: blur(8px); animation: atmospheric-glow-pulse 10s ease-in-out infinite;"></div>
        </div>

        <!-- City lights glow on the night side (left portion of horizon) -->
        <div class="absolute pointer-events-none" aria-hidden="true" style="bottom: 38vh; left: 0; width: 35%; height: 60px; background: radial-gradient(ellipse at 50% 80%, rgba(255,210,120,0.04) 0%, transparent 70%); filter: blur(3px);"></div>

        <!-- Spacecraft window frame effect -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true" style="border: 1px solid rgba(255,255,255,0.02); box-shadow: inset 0 0 150px rgba(0,0,0,0.9), inset 0 0 60px rgba(0,0,0,0.6), inset 0 -40px 80px rgba(0,0,0,0.4);"></div>

        <!-- "Pale Blue Dot" watermark — centered in upper black space -->
        <div class="absolute left-0 right-0 flex justify-center pointer-events-none" style="top: 38%; transform: translateY(-50%);">
            <p class="horizon-watermark" style="font-family: var(--font-display); color: var(--text-subtle); font-size: clamp(18px, 2.8vw, 36px); letter-spacing: 0.4em; text-transform: uppercase; font-weight: 300; opacity: 0.25;">
                Pale Blue Dot
            </p>
        </div>

        <!-- Carl Sagan attribution -->
        <div class="absolute left-0 right-0 flex justify-center pointer-events-none" style="top: calc(38% + 3.5vw);">
            <p class="horizon-subtitle" style="font-family: var(--font-display); color: var(--text-subtle); font-size: clamp(9px, 0.9vw, 13px); letter-spacing: 0.25em; opacity: 0.12; font-weight: 300;">
                Carl Sagan, 1990
            </p>
        </div>

    </main>

    <!-- Custom CSS for horizon composition (placed before </body> per rules) -->
    <style>
        /* ========== HORIZON STAR LAYERS ========== */
        .horizon-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Stars concentrated in upper 60% — sparse near horizon to not compete with Earth */
        .horizon-stars-small {
            background-image:
                radial-gradient(1px 1px at 8% 5%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1px 1px at 22% 12%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 38% 3%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 55% 18%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 72% 8%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1px 1px at 88% 22%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 15% 28%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 62% 32%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 93% 6%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 35% 42%, rgba(255,245,230,0.2), transparent),
                radial-gradient(1px 1px at 5% 48%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 78% 45%, rgba(255,245,230,0.2), transparent),
                radial-gradient(1px 1px at 48% 25%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 28% 55%, rgba(255,245,230,0.15), transparent),
                radial-gradient(1px 1px at 95% 38%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 42% 10%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 68% 50%, rgba(255,245,230,0.1), transparent),
                radial-gradient(1px 1px at 18% 38%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 82% 28%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1px 1px at 52% 15%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1px 1px at 3% 22%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1px 1px at 58% 8%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1px 1px at 75% 55%, rgba(255,245,230,0.1), transparent),
                radial-gradient(1px 1px at 45% 35%, rgba(255,245,230,0.35), transparent);
            animation: horizon-twinkle-slow 9s ease-in-out infinite alternate;
        }

        .horizon-stars-medium {
            background-image:
                radial-gradient(1.5px 1.5px at 14% 15%, rgba(255,245,230,0.8), transparent),
                radial-gradient(1.5px 1.5px at 48% 7%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1.5px 1.5px at 76% 20%, rgba(255,245,230,0.7), transparent),
                radial-gradient(1.5px 1.5px at 32% 30%, rgba(255,245,230,0.5), transparent),
                radial-gradient(1.5px 1.5px at 90% 12%, rgba(255,245,230,0.4), transparent),
                radial-gradient(1.5px 1.5px at 8% 40%, rgba(255,245,230,0.3), transparent),
                radial-gradient(1.5px 1.5px at 60% 22%, rgba(255,245,230,0.6), transparent),
                radial-gradient(1.5px 1.5px at 85% 42%, rgba(255,245,230,0.2), transparent),
                radial-gradient(1.5px 1.5px at 25% 18%, rgba(255,245,230,0.7), transparent),
                radial-gradient(1.5px 1.5px at 55% 38%, rgba(255,245,230,0.3), transparent);
            animation: horizon-twinkle-medium 13s ease-in-out infinite alternate;
        }

        .horizon-stars-large {
            background-image:
                radial-gradient(2px 2px at 20% 8%, rgba(255,245,230,1), transparent),
                radial-gradient(2.5px 2.5px at 65% 25%, rgba(255,220,180,0.9), transparent),
                radial-gradient(2px 2px at 40% 18%, rgba(255,245,230,0.8), transparent),
                radial-gradient(2px 2px at 80% 5%, rgba(255,245,230,0.7), transparent),
                radial-gradient(2.5px 2.5px at 10% 33%, rgba(255,230,200,0.6), transparent);
            animation: horizon-twinkle-fast 7s ease-in-out infinite alternate;
        }

        @keyframes horizon-twinkle-slow {
            0% { opacity: 0.4; }
            50% { opacity: 0.7; }
            100% { opacity: 0.5; }
        }

        @keyframes horizon-twinkle-medium {
            0% { opacity: 0.3; }
            50% { opacity: 0.85; }
            100% { opacity: 0.45; }
        }

        @keyframes horizon-twinkle-fast {
            0% { opacity: 0.2; }
            33% { opacity: 1; }
            66% { opacity: 0.5; }
            100% { opacity: 0.7; }
        }

        /* ========== ATMOSPHERIC GLOW LINE PULSE ========== */
        @keyframes atmospheric-glow-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ========== WATERMARK BREATHING ========== */
        .horizon-watermark {
            animation: horizon-text-breathe 18s ease-in-out infinite;
        }

        .horizon-subtitle {
            animation: horizon-text-breathe 18s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes horizon-text-breathe {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.3; }
        }

        /* ========== CUSTOM :ROOT VARIABLES (extending existing) ========== */
        :root {
            --space-deep: #000000;
            --text-subtle: rgba(255, 255, 255, 0.3);
            --space-black: #0a0a1a;
        }

        /* ========== REDUCED MOTION ========== */
        @media (prefers-reduced-motion: reduce) {
            .horizon-stars-small,
            .horizon-stars-medium,
            .horizon-stars-large,
            .horizon-watermark,
            .horizon-subtitle {
                animation: none !important;
            }
            /* Disable glow pulse */
            [style*="atmospheric-glow-pulse"] {
                animation: none !important;
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 640px) {
            .horizon-watermark {
                font-size: clamp(14px, 3.5vw, 20px);
                letter-spacing: 0.25em;
            }
            .horizon-subtitle {
                font-size: clamp(8px, 1.5vw, 11px);
            }
        }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
