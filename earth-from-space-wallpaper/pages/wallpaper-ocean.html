<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海洋剖面壁纸</title>
    <style id="theme-vars">
:root {
  --color-primary: #1a3a5c;
  --color-primary-light: #2a5a8c;
  --color-primary-dark: #0a1a2c;
  --color-foreground: #e8edf2;
  --color-foreground-muted: rgba(232, 237, 242, 0.6);
  --color-background: #0a0a1a;
  --color-surface: #111827;
  --color-surface-elevated: #1a2332;
  --color-border: rgba(255, 255, 255, 0.08);
  --state-success: #22c55e;
  --state-warning: #eab308;
  --state-error: #ef4444;
  --state-info: #3b82f6;
  --radius-sm: 2px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --ocean-deep: #041c32;
  --ocean-mid: #064663;
  --ocean-light: #04293a;
  --coral-warm: #ecb365;
  --bioluminescent: rgba(64, 224, 208, 0.3);
  --foam-white: rgba(255, 255, 255, 0.7);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-space-background: var(--color-background);
    --color-space-foreground: var(--color-foreground);
    --color-space-primary: var(--color-primary);
    --color-space-surface: var(--color-surface);
    --color-space-border: var(--color-border);
  }

  @layer base {
    body { background: var(--space-background); color: var(--space-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative w-full min-h-screen overflow-hidden">

        <!-- Full-screen ocean cross-section hero image -->
        <div class="absolute inset-0" aria-hidden="true">
            <img src="../assets/ocean-cross-section.jpg" alt="" class="w-full h-full object-cover" style="object-position: center 50%;">
        </div>

        <!-- Warm overlay for sky (top half) -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true" style="background: linear-gradient(180deg, rgba(255, 220, 160, 0.06) 0%, rgba(255, 200, 120, 0.03) 40%, transparent 50%);"></div>

        <!-- Cool deep overlay for underwater (bottom half) -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true" style="background: linear-gradient(180deg, transparent 50%, rgba(4, 28, 50, 0.15) 65%, rgba(4, 20, 40, 0.45) 85%, rgba(2, 10, 20, 0.7) 100%);"></div>

        <!-- Wave animation at waterline (the ocean's heartbeat) -->
        <div class="absolute inset-x-0 pointer-events-none wave-line-container" aria-hidden="true" style="top: calc(50% - 3px);">
            <div class="wave-line wave-line-1"></div>
            <div class="wave-line wave-line-2"></div>
            <div class="wave-line wave-line-3"></div>
            <div class="wave-line wave-line-glow"></div>
        </div>

        <!-- Soft vignette on edges -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true" style="box-shadow: inset 0 0 150px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.3);"></div>

        <!-- Bottom watermark: "Two worlds, one ocean" -->
        <div class="absolute bottom-10 left-0 right-0 flex flex-col items-center pointer-events-none">
            <p class="watermark-text" style="font-family: Georgia, 'Times New Roman', serif; color: var(--foam-white); font-size: clamp(14px, 1.4vw, 20px); letter-spacing: 0.3em; text-transform: uppercase; font-weight: 300; opacity: 0.2;">
                Two worlds, one ocean
            </p>
            <p class="watermark-subtitle" style="font-family: Georgia, 'Times New Roman', serif; color: var(--foam-white); font-size: clamp(10px, 0.8vw, 13px); letter-spacing: 0.25em; opacity: 0.12; margin-top: 6px;">
                &mdash; Sylvia Earle
            </p>
        </div>

    </main>
    <script>lucide.createIcons();</script>

    <style>
        /* ========== WAVE ANIMATION — The ocean's heartbeat at the waterline ========== */
        .wave-line-container {
            height: 6px;
            overflow: visible;
        }

        .wave-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            pointer-events: none;
        }

        /* Primary undulating wave */
        .wave-line-1 {
            background: linear-gradient(90deg,
                transparent 0%,
                var(--foam-white) 15%,
                var(--bioluminescent) 40%,
                var(--foam-white) 60%,
                var(--bioluminescent) 85%,
                transparent 100%
            );
            opacity: 0.25;
            animation: wave-undulate-1 6s ease-in-out infinite;
            filter: blur(1px);
        }

        /* Secondary counter-wave */
        .wave-line-2 {
            background: linear-gradient(90deg,
                transparent 0%,
                var(--foam-white) 20%,
                rgba(100, 200, 220, 0.2) 50%,
                var(--foam-white) 80%,
                transparent 100%
            );
            opacity: 0.15;
            animation: wave-undulate-2 8s ease-in-out infinite;
            filter: blur(2px);
        }

        /* Tertiary subtle shimmer */
        .wave-line-3 {
            background: linear-gradient(90deg,
                transparent 5%,
                rgba(200, 230, 255, 0.15) 30%,
                var(--bioluminescent) 55%,
                rgba(200, 230, 255, 0.15) 75%,
                transparent 95%
            );
            opacity: 0.12;
            animation: wave-undulate-3 10s ease-in-out infinite;
            filter: blur(3px);
        }

        /* Soft glow at waterline threshold */
        .wave-line-glow {
            background: radial-gradient(ellipse at 50% 50%,
                rgba(64, 224, 208, 0.08) 0%,
                rgba(70, 130, 200, 0.04) 40%,
                transparent 70%
            );
            opacity: 0.5;
            animation: wave-glow-pulse 7s ease-in-out infinite;
            filter: blur(6px);
        }

        @keyframes wave-undulate-1 {
            0%, 100% { transform: translateY(0px) scaleY(1); opacity: 0.2; }
            25% { transform: translateY(-1.5px) scaleY(1.8); opacity: 0.35; }
            50% { transform: translateY(1px) scaleY(1.2); opacity: 0.18; }
            75% { transform: translateY(-0.5px) scaleY(1.5); opacity: 0.28; }
        }

        @keyframes wave-undulate-2 {
            0%, 100% { transform: translateY(0px) scaleY(1); opacity: 0.12; }
            30% { transform: translateY(1px) scaleY(2); opacity: 0.2; }
            60% { transform: translateY(-1px) scaleY(1.3); opacity: 0.1; }
            80% { transform: translateY(0.5px) scaleY(1.6); opacity: 0.18; }
        }

        @keyframes wave-undulate-3 {
            0%, 100% { transform: translateY(0px) scaleY(1); opacity: 0.08; }
            40% { transform: translateY(-2px) scaleY(2.5); opacity: 0.15; }
            70% { transform: translateY(1.5px) scaleY(1.4); opacity: 0.06; }
        }

        @keyframes wave-glow-pulse {
            0%, 100% { transform: scaleX(1); opacity: 0.4; }
            50% { transform: scaleX(1.02); opacity: 0.7; }
        }

        /* ========== WATERMARK BREATHING ANIMATION ========== */
        .watermark-text {
            animation: watermark-breathe 12s ease-in-out infinite;
        }

        .watermark-subtitle {
            animation: watermark-breathe-subtle 12s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes watermark-breathe {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.32; }
        }

        @keyframes watermark-breathe-subtle {
            0%, 100% { opacity: 0.12; }
            50% { opacity: 0.2; }
        }

        /* ========== REDUCED MOTION ========== */
        @media (prefers-reduced-motion: reduce) {
            .wave-line-1,
            .wave-line-2,
            .wave-line-3,
            .wave-line-glow,
            .watermark-text,
            .watermark-subtitle {
                animation: none;
            }
        }
    </style>
</body>
</html>
