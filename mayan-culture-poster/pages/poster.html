:root {
  /* ── Color System ── */
  --color-primary: #2D6B4F;
  --color-primary-light: #3D8F6A;
  --color-primary-lighter: #6AAF8E;
  --color-primary-lightest: #B0D4BF;
  --color-primary-dark: #1E4A37;
  --color-primary-darker: #133326;
  --color-primary-darkest: #0A1E15;

  /* ── Semantic / State Colors ── */
  --state-success: #4A8F5A;
  --state-warning: #C49A3A;
  --state-error: #A85D4A;
  --state-info: #5A7F9F;

  /* ── Surface Palette (Limestone / Stone Tones) ── */
  --color-bg-main: #F2EDE4;
  --color-bg-secondary: #EAE3D6;
  --color-bg-tertiary: #E0D7C8;
  --color-bg-elevated: #F7F4EF;
  --color-bg-overlay: rgba(10, 30, 21, 0.7);

  /* ── Gold Accent ── */
  --color-gold: #B8922E;
  --color-gold-light: #D4AD4E;
  --color-gold-lighter: #E8CFA0;
  --color-gold-dark: #8A6D1E;

  /* ── Stone / Terracotta ── */
  --color-stone: #8B7D6B;
  --color-stone-light: #A89577;
  --color-stone-dark: #5C5040;

  /* ── Text Palette ── */
  --color-text-primary: #1A1A17;
  --color-text-secondary: #3D3D35;
  --color-text-tertiary: #6B6B60;
  --color-text-inverse: #F2EDE4;
  --color-text-link: #1E4A37;

  /* ── Border Palette ── */
  --color-border: #C9BFA8;
  --color-border-subtle: #E0D7C8;
  --color-border-strong: #2D6B4F;

  /* ── Typography ── */
  --font-family-display: "Cinzel", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --font-family-body: "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --font-family-accent: "Cinzel Decorative", "Cinzel", "Noto Serif SC", serif;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-md: 1.125rem;
  --font-size-lg: 1.25rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;
  --font-size-3xl: 2.5rem;
  --font-size-4xl: 3.25rem;
  --font-size-5xl: 4.5rem;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.2;
  --line-height-snug: 1.35;
  --line-height-normal: 1.6;
  --line-height-relaxed: 1.8;
  --line-height-loose: 2.0;

  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0em;
  --letter-spacing-wide: 0.08em;
  --letter-spacing-wider: 0.15em;
  --letter-spacing-widest: 0.3em;

  /* ── Spacing ── */
  --space-0: 0;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-8: 3rem;
  --space-10: 4rem;
  --space-12: 6rem;
  --space-16: 8rem;

  /* ── Radius ── */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-sm: 0 1px 2px rgba(10, 30, 21, 0.04);
  --shadow-md: 0 2px 8px rgba(10, 30, 21, 0.05);
  --shadow-lg: 0 8px 24px rgba(10, 30, 21, 0.05);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-normal: 300ms ease;
  --transition-slow: 500ms ease;
}

/* ── Dark Mode ── */

    <!-- ═══ Poster Custom Styles ═══ -->
    <style>
      /* ── Stone texture background ── */
      body {
        background: var(--color-bg-main);
        background-image:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0,0,0,0.008) 3px,
            rgba(0,0,0,0.008) 4px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 5px,
            rgba(0,0,0,0.005) 5px,
            rgba(0,0,0,0.005) 6px
          );
        min-height: 100vh;
      }

      /* ── Stepped Pyramid Border Frame ── */
      .poster-frame {
        position: relative;
        margin: 0 auto;
        max-width: 700px;
        min-height: 100vh;
        padding: 2rem;
        border: 1.5px solid var(--color-primary);
      }

      /* Top border with stepped corners */
      .poster-frame::before,
      .poster-frame::after {
        content: '';
        position: absolute;
        top: -1.5px;
        height: 2px;
        background: var(--color-primary);
      }
      .poster-frame::before {
        left: 0;
        right: 0;
      }

      /* ── Corner ornaments: stepped pyramid at each corner ── */
      .corner-ornament {
        position: absolute;
        width: 48px;
        height: 48px;
      }

      .corner-ornament--tl { top: -1px; left: -1px; }
      .corner-ornament--tr { top: -1px; right: -1px; transform: scaleX(-1); }
      .corner-ornament--bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
      .corner-ornament--br { bottom: -1px; right: -1px; transform: scale(-1,-1); }

      .corner-ornament .step {
        position: absolute;
        left: 0;
        background: var(--color-primary);
      }
      .corner-ornament .step-1 {
        top: 0;
        width: 48px;
        height: 4px;
      }
      .corner-ornament .step-2 {
        top: 0;
        left: 0;
        width: 4px;
        height: 48px;
      }
      .corner-ornament .step-3 {
        top: 6px;
        left: 6px;
        width: 36px;
        height: 3px;
      }
      .corner-ornament .step-4 {
        top: 6px;
        left: 0;
        width: 3px;
        height: 36px;
      }
      .corner-ornament .step-5 {
        top: 12px;
        left: 12px;
        width: 24px;
        height: 2px;
      }
      .corner-ornament .step-6 {
        top: 12px;
        left: 0;
        width: 2px;
        height: 24px;
      }
      .corner-ornament .step-7 {
        top: 17px;
        left: 17px;
        width: 14px;
        height: 1.5px;
      }
      .corner-ornament .step-8 {
        top: 17px;
        left: 0;
        width: 1.5px;
        height: 14px;
      }

      /* ── CSS Pyramid Icon (3 stacked bars) ── */
      .pyramid-icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .pyramid-icon .bar {
        height: 3px;
        border-radius: 1px;
      }
      .pyramid-icon--gold .bar { background: var(--color-gold); }
      .pyramid-icon--primary .bar { background: var(--color-primary-lighter); }

      .pyramid-icon .bar-1 { width: 12px; }
      .pyramid-icon .bar-2 { width: 24px; }
      .pyramid-icon .bar-3 { width: 36px; }

      /* ── Gold Ornamental Divider ── */
      .gold-divider {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 1rem 0;
      }
      .gold-divider .line {
        flex: 1;
        max-width: 120px;
        height: 1px;
        background: var(--color-gold);
      }
      .gold-divider .diamond {
        width: 8px;
        height: 8px;
        background: var(--color-gold);
        transform: rotate(45deg);
        flex-shrink: 0;
      }
      .gold-divider .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--color-gold);
        flex-shrink: 0;
      }

      /* ── Glyph Decoration Band ── */
      .glyph-band {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        padding: 1rem 0;
      }
      .glyph-band .glyph-block {
        width: 14px;
        height: 14px;
        border: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .glyph-band .glyph-block::after {
        content: '';
        width: 6px;
        height: 6px;
        border: 1px solid var(--color-border);
        transform: rotate(45deg);
      }

      /* ── Sun Disk ── */
      .sun-disk {
        width: 28px;
        height: 28px;
        border: 2px solid var(--color-gold);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .sun-disk::before {
        content: '';
        width: 10px;
        height: 10px;
        background: var(--color-gold);
        border-radius: 50%;
      }
      .sun-disk::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border: 1px solid var(--color-gold);
        border-radius: 50%;
      }

      /* ── Pillar columns ── */
      .pillar-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 1rem;
      }
      .pillar-column + .pillar-column {
        border-left: 1px solid var(--color-border-subtle);
      }

      /* ── Hero section ── */
      .hero-section {
        position: relative;
        width: 100%;
        height: 55vh;
        min-height: 320px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .hero-section img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          var(--color-primary-darkest) 0%,
          rgba(10, 30, 21, 0.6) 50%,
          rgba(10, 30, 21, 0.25) 100%
        );
      }
      .hero-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem;
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        .poster-frame { padding: 1rem; }
        .pillar-column { padding: 0 0.5rem; }
      }
    </style>
