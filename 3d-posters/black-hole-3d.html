<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gargantua</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  .ui {
    position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10;
  }
  .ui h1 {
    text-align: center; padding-top: 30px;
    font-family: 'Georgia', serif; font-size: 1.6rem; font-weight: 300;
    letter-spacing: 0.4em; color: rgba(200,160,80,0.3);
  }
  .hint {
    position: fixed; bottom: 20px; right: 24px; z-index: 10; pointer-events: none;
    font-family: 'Courier New', monospace; font-size: 0.65rem;
    color: rgba(150,120,60,0.2);
  }
  .loading {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace; font-size: 0.75rem;
    color: rgba(180,140,60,0.4); letter-spacing: 0.3em;
    transition: opacity 1.5s ease;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="loading" id="loading">GARGANTUA</div>
<canvas id="c"></canvas>
<div class="ui"><h1>GARGANTUA</h1></div>
<div class="hint">DRAG · SCROLL</div>

<script>
  // Error overlay helper
  function showOverlay(text, isError) {
    var el = document.getElementById('loading');
    if (el) {
      el.textContent = text;
      el.style.whiteSpace = 'pre-wrap';
      el.style.padding = '40px';
      el.style.fontSize = '0.7rem';
      el.style.color = isError ? 'rgba(255,120,120,0.7)' : 'rgba(180,140,60,0.5)';
      el.style.opacity = '1';
    }
  }

  // WebGL support check
  (function() {
    var canvas = document.createElement('canvas');
    var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!gl) {
      showOverlay('您的浏览器或显卡不支持 WebGL，无法显示 3D 黑洞。\n请尝试更换浏览器或启用硬件加速。', true);
      window._webglFailed = true;
      return;
    }
    // Hide loading screen after delay even if module is slow
    setTimeout(function() {
      var el = document.getElementById('loading');
      if (el && !window._moduleLoaded) {
        el.classList.add('hidden');
      }
    }, 3000);
  })();

  // Catch module import errors / runtime errors
  window.addEventListener('error', function(e) {
    console.error(e);
    showOverlay('3D 场景初始化出错：\n' + (e.message || '未知错误') + '\n请按 F12 查看控制台。', true);
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ═══════════════════════════════════════════════════════════
//  CORE
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 12, 75);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 35;
controls.maxDistance = 300;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.08;

// ═══════════════════════════════════════════════════════════
//  BLOOM — very subtle
// ═══════════════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.4, 0.12
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ═══════════════════════════════════════════════════════════
//  PARAMS
// ═══════════════════════════════════════════════════════════
const BH_R = 10;
const DISK_IN = BH_R * 1.4;
const DISK_OUT = BH_R * 6.5;
const TILT = 1.15; // disk tilt radians from horizontal (~66 deg)

// ═══════════════════════════════════════════════════════════
//  STARFIELD — very faint, deep space
// ═══════════════════════════════════════════════════════════
{
  const N = 5000;
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(N * 3);
  const c = new Float32Array(N * 3);
  const s = new Float32Array(N);
  const ph = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const th = Math.random() * 6.283;
    const fi = Math.acos(2 * Math.random() - 1);
    const r = 900 + Math.random() * 1100;
    p[i*3] = r * Math.sin(fi) * Math.cos(th);
    p[i*3+1] = r * Math.cos(fi);
    p[i*3+2] = r * Math.sin(fi) * Math.sin(th);
    const t = Math.random();
    if (t < 0.5) { c[i*3]=0.8; c[i*3+1]=0.85; c[i*3+2]=1.0; }
    else if (t < 0.8) { c[i*3]=1.0; c[i*3+1]=0.95; c[i*3+2]=0.85; }
    else { c[i*3]=1.0; c[i*3+1]=0.8; c[i*3+2]=0.5; }
    s[i] = Math.random() * 1.2 + 0.2;
    ph[i] = Math.random() * 6.283;
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(c, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(s, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute vec3 aColor; attribute float aSize; attribute float aPhase;
      varying vec3 vC; varying float vT;
      uniform float uTime;
      void main() {
        vC = aColor;
        vT = 0.5 + 0.5 * sin(uTime * 1.2 + aPhase);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (250.0 / -mv.z) * (0.3 + vT * 0.5);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vC; varying float vT;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d) * (0.1 + vT * 0.2);
      gl_FragColor = vec4(vC, a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const stars = new THREE.Points(g, m);
  scene.add(stars);
  window._starMat = m;
}

// ═══════════════════════════════════════════════════════════
//  EVENT HORIZON — pure black sphere
// ═══════════════════════════════════════════════════════════
const eventHorizon = new THREE.Mesh(
  new THREE.SphereGeometry(BH_R, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(eventHorizon);

// ═══════════════════════════════════════════════════════════
//  ACCRETION DISK — golden, tilted, with turbulence + Doppler
// ═══════════════════════════════════════════════════════════
const diskGeo = new THREE.RingGeometry(DISK_IN, DISK_OUT, 360, 200);
// Remap UVs: x = angle, y = radial t (0=inner, 1=outer)
{
  const uv = diskGeo.attributes.uv;
  const pos = diskGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const r = Math.sqrt(x*x + y*y);
    const angle = Math.atan2(y, x);
    uv.setXY(i, (angle / Math.PI) * 0.5 + 0.5, (r - DISK_IN) / (DISK_OUT - DISK_IN));
  }
}

const diskMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uInnerR: { value: DISK_IN },
    uOuterR: { value: DISK_OUT }
  },
  vertexShader: `
    varying vec2 vUv; varying vec3 vPos;
    void main() {
      vUv = uv; vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uInnerR;
    uniform float uOuterR;
    varying vec2 vUv;
    varying vec3 vPos;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
                 mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 6; i++) { v += a * noise(p); p *= 2.1; a *= 0.5; }
      return v;
    }
    float fbmSlow(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 1.9; a *= 0.5; }
      return v;
    }

    void main() {
      float r = length(vPos.xy);
      float t = (r - uInnerR) / (uOuterR - uInnerR);
      float angle = atan(vPos.y, vPos.x);

      // Keplerian differential rotation — inner rings whip around far faster
      float omega = 0.75 / (r / uInnerR + 0.25);
      float rotA = angle - uTime * omega;

      // Logarithmic spiral: winds tighter toward the center (the drain hole)
      float logR = log(max(r / uInnerR, 1.0));
      float WIND = 4.2;
      float s = rotA - logR * WIND;                  // constant s => one spiral streamline
      // Spiral arms: moderate power keeps filaments visible but blended like gas
      float armBright = pow(0.5 + 0.5 * sin(s), 1.55);

      // True 2D cloud turbulence.  The previous attempts used a simple rotated
      // Cartesian fbm plus a logR-based spiral shear, which produced regular
      // moiré / grid-like artifacts (the screenshot).  To get real, organic gas
      // clouds we use DOMAIN WARPING: a low-frequency noise field warps the
      // coordinates used to sample a higher-frequency cloud noise.  This breaks
      // any regular grid, spiral, or concentric patterns.
      float texRot = uTime * 0.05;
      float ca = cos(texRot), sa = sin(texRot);
      vec2 rp = vec2(vPos.x * ca - vPos.y * sa, vPos.x * sa + vPos.y * ca);

      // Base drifting coordinate
      vec2 baseUV = rp * 0.06 + vec2(uTime * 0.02, uTime * 0.015);

      // Domain warp: low-frequency distortion field that smears the sample grid
      vec2 warp = vec2(
        fbmSlow(baseUV * 0.55 + vec2(3.1, 7.4)),
        fbmSlow(baseUV * 0.55 + vec2(11.7, 2.3))
      );
      vec2 flowUV = baseUV + warp * 0.45;

      // Cloud detail on the warped coordinates
      float n1 = fbm(flowUV * 1.3);
      float n2 = fbm(flowUV * 2.2 + vec2(7.0, 3.0));
      float cloud = n1 * 0.55 + n2 * 0.45;
      cloud = smoothstep(0.35, 0.8, cloud) * 1.15; // stretch contrast, keep it soft

      // Density = swirling filaments concentrated into the spiral arms
      float density = cloud * (0.2 + 0.8 * armBright);

      // Gargantua palette: hot white-gold inner → amber → dark brown outer
      vec3 cInner = vec3(1.0, 0.9, 0.55);
      vec3 cMid   = vec3(0.95, 0.55, 0.16);
      vec3 cOuter = vec3(0.4, 0.15, 0.04);
      vec3 cEdge  = vec3(0.1, 0.03, 0.01);

      vec3 color = mix(cInner, cMid, smoothstep(0.0, 0.35, t));
      color = mix(color, cOuter, smoothstep(0.35, 0.75, t));
      color = mix(color, cEdge, smoothstep(0.75, 1.0, t));

      // Intense inner-edge glow (matter piling into the horizon)
      float innerGlow = smoothstep(0.2, 0.0, t);
      color += vec3(0.7, 0.5, 0.22) * innerGlow * 0.55;

      // Doppler beaming — approaching side brighter
      float doppler = 1.0 + 0.45 * cos(angle - 1.2);
      color *= doppler;

      // Soft radial fade at inner/outer edges
      float edgeFade = smoothstep(0.0, 0.06, t) * smoothstep(1.0, 0.7, t);
      float alpha = density * edgeFade;

      gl_FragColor = vec4(color * density * 1.7, alpha);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const accretionDisk = new THREE.Mesh(diskGeo, diskMat);
accretionDisk.rotation.x = -TILT;
scene.add(accretionDisk);

// ═══════════════════════════════════════════════════════════
//  NEBULA VORTEX — spiral arms of glowing gas being sucked in
//  Particles cluster into logarithmic spiral arms; as they drift
//  inward their angle is recomputed from the spiral law, so the
//  arms wind tighter and tighter — a whirlpool feeding the BH.
// ═══════════════════════════════════════════════════════════
const NEBULA_N = 8000;
const NEBULA_IN = DISK_IN * 0.9;
const NEBULA_OUT = DISK_OUT * 1.5;
const NEBULA_ARMS = 2;       // number of spiral arms
const NEBULA_WIND = 5.4;     // spiral tightness (higher = more winding)

const nebulaG = new THREE.BufferGeometry();
const nbP = new Float32Array(NEBULA_N * 3);
const nbC = new Float32Array(NEBULA_N * 3);
const nbS = new Float32Array(NEBULA_N);
const nbPhase = new Float32Array(NEBULA_N);
const nbRad = new Float32Array(NEBULA_N);   // current radius
const nbArm = new Float32Array(NEBULA_N);   // which arm (0..ARMS-1)
const nbJit = new Float32Array(NEBULA_N);   // angular jitter around the arm
const nbY0 = new Float32Array(NEBULA_N);    // gaussian unit for funnel height

// Box-Muller Gaussian
function gauss(sigma) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * sigma;
}

// Logarithmic spiral: angle increases as radius shrinks → winds inward
function nebulaAngle(r, arm, jit, timePhase) {
  return Math.log(r / NEBULA_IN) * NEBULA_WIND
       + (arm / NEBULA_ARMS) * 6.2831853
       + jit + timePhase;
}

for (let i = 0; i < NEBULA_N; i++) {
  // Radial distribution skewed toward the center (more gas near the BH)
  const u = Math.random();
  const r = NEBULA_IN + Math.pow(u, 1.4) * (NEBULA_OUT - NEBULA_IN);
  const arm = Math.floor(Math.random() * NEBULA_ARMS);
  // Tighter jitter near the center so arms sharpen as they wind in
  const jitScale = 0.20 + 0.14 * (r / NEBULA_OUT);
  const jit = gauss(jitScale);

  const angle = nebulaAngle(r, arm, jit, 0.0);

  // Funnel thickness: wide/cloudy outside, pinched near the center
  const thick = 1.2 + (r / NEBULA_OUT) * 3.6;
  const y0 = gauss(0.45);

  nbRad[i] = r;
  nbArm[i] = arm;
  nbJit[i] = jit;
  nbY0[i] = y0;
  nbP[i*3]   = Math.cos(angle) * r;
  nbP[i*3+1] = y0 * thick * 0.5;
  nbP[i*3+2] = Math.sin(angle) * r;

  // Color: outer cool brown → inner hot amber
  const t = Math.max(0, Math.min(1, (r - NEBULA_IN) / (NEBULA_OUT - NEBULA_IN)));
  nbC[i*3]   = 1.0;
  nbC[i*3+1] = Math.max(0.28, 0.85 - t * 0.45);
  nbC[i*3+2] = Math.max(0.04, 0.5 - t * 0.45);

  nbS[i] = (3.5 + Math.random() * 4.5) * (1.0 - t * 0.35);
  nbPhase[i] = Math.random() * 6.283;
}

nebulaG.setAttribute('position', new THREE.BufferAttribute(nbP, 3));
nebulaG.setAttribute('aColor', new THREE.BufferAttribute(nbC, 3));
nebulaG.setAttribute('aSize', new THREE.BufferAttribute(nbS, 1));
nebulaG.setAttribute('aPhase', new THREE.BufferAttribute(nbPhase, 1));

const nebulaMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uNebIn: { value: NEBULA_IN }, uNebOut: { value: NEBULA_OUT } },
  vertexShader: `
    attribute vec3 aColor; attribute float aSize; attribute float aPhase;
    varying vec3 vC; varying float vTw; varying float vR;
    uniform float uTime;
    void main() {
      vC = aColor;
      vR = length(position.xz);
      vTw = 0.6 + 0.4 * sin(uTime * 0.8 + aPhase);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (260.0 / -mv.z) * vTw;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vC; varying float vTw; varying float vR;
    uniform float uNebIn; uniform float uNebOut;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      // Smooth radial fade — no hard inner/outer edge, so the cloud
      // never looks "cut off" at a ring boundary.
      float nt = clamp((vR - uNebIn) / (uNebOut - uNebIn), 0.0, 1.0);
      float radFade = smoothstep(0.0, 0.14, nt) * smoothstep(1.0, 0.66, nt);
      // Very soft radial falloff for cloud-like puff
      float a = pow(1.0 - smoothstep(0.0, 0.5, d), 1.8) * 0.12 * vTw * radFade;
      gl_FragColor = vec4(vC * 0.55, a);
    }
  `,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});

const nebula = new THREE.Points(nebulaG, nebulaMat);
nebula.rotation.x = -TILT;
scene.add(nebula);
window._nebula = {
  geo: nebulaG, pos: nbP, n: NEBULA_N,
  rad: nbRad, arm: nbArm, jit: nbJit, y0: nbY0
};

// ═══════════════════════════════════════════════════════════
//  GRAVITATIONAL LENSING — the Gargantua "halo wrap" effect
//  Light from the far side of the disk bends over & under the BH,
//  creating the iconic ring that appears to wrap around the sphere.
// ═══════════════════════════════════════════════════════════

// ── Lensing ring (vertical, facing camera) ──
// This represents the gravitationally lensed image of the disk
// that wraps over and under the black hole.
const lensRingGeo = new THREE.RingGeometry(BH_R * 1.25, BH_R * 2.4, 256, 8);
{
  const uv = lensRingGeo.attributes.uv;
  const pos = lensRingGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const r = Math.sqrt(x*x + y*y);
    const angle = Math.atan2(y, x);
    uv.setXY(i, (angle / Math.PI) * 0.5 + 0.5, (r - BH_R * 1.25) / (BH_R * 2.4 - BH_R * 1.25));
  }
}

const lensRingMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv; varying vec3 vPos;
    void main() {
      vUv = uv; vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vPos;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
                 mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
      return v;
    }

    void main() {
      float r = length(vPos.xy);
      float t = (r - 10.0 * 1.25) / (10.0 * 2.4 - 10.0 * 1.25);
      float angle = atan(vPos.y, vPos.x);

      // Seamless turbulence: rotate position by time, use Cartesian coords (no atan seam)
      float rotA = uTime * 0.1;
      float ca = cos(rotA), sa = sin(rotA);
      vec2 rp = vec2(vPos.x * ca - vPos.y * sa, vPos.x * sa + vPos.y * ca);
      float n = fbm(rp * 0.08);
      float density = pow(n, 1.4);

      // Golden color — brighter than disk (lensed light is concentrated)
      vec3 cBright = vec3(1.0, 0.78, 0.38);
      vec3 cDim    = vec3(0.5, 0.25, 0.08);
      vec3 color = mix(cBright, cDim, t);

      // Brightest near inner edge (closest to photon sphere)
      float innerBoost = smoothstep(0.3, 0.0, t) * 1.5;
      color += vec3(0.4, 0.28, 0.1) * innerBoost;

      // Doppler asymmetry
      color *= 1.0 + 0.3 * cos(angle - 1.2);

      float edgeFade = smoothstep(0.0, 0.08, t) * smoothstep(1.0, 0.7, t);
      float alpha = density * edgeFade * 0.55;

      gl_FragColor = vec4(color * density * 1.0, alpha);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const lensRing = new THREE.Mesh(lensRingGeo, lensRingMat);
// Orient vertical, facing camera — this is the "wrap" plane
lensRing.rotation.x = 0; // stays in XY plane (vertical, facing -Z)
scene.add(lensRing);

// ── Photon sphere — thin intense ring at ~1.5 Rs ──
const photonGeo = new THREE.RingGeometry(BH_R * 1.18, BH_R * 1.32, 256, 4);
const photonMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      float pulse = 0.75 + 0.25 * sin(uTime * 1.8);
      vec3 color = vec3(1.0, 0.85, 0.5) * pulse * 1.5;
      float a = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.7, vUv.y);
      gl_FragColor = vec4(color, a * 0.55);
    }
  `,
  transparent: true, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const photonRing = new THREE.Mesh(photonGeo, photonMat);
// Photon ring should be visible from all angles → use a sphere shell approach
// Create two perpendicular rings for fuller coverage
const photonRing2 = new THREE.Mesh(photonGeo.clone(), photonMat);
photonRing2.rotation.y = Math.PI / 2;
scene.add(photonRing);
scene.add(photonRing2);

// ═══════════════════════════════════════════════════════════
//  VORTEX PARTICLES — dramatic spiral inflow into the black hole
//  Keplerian dynamics: inner particles orbit faster & drain quicker,
//  creating a visible swirling vortex that feeds the event horizon.
// ═══════════════════════════════════════════════════════════
const vortexN = 4000;
const vortexG = new THREE.BufferGeometry();
const vP = new Float32Array(vortexN * 3);   // positions (x,y,z)
const vC = new Float32Array(vortexN * 3);   // colors (r,g,b)
const vS = new Float32Array(vortexN);        // point sizes
const vPhase = new Float32Array(vortexN);    // twinkle phase
// Parametric state (stored separately, position recomputed each frame)
const vAng = new Float32Array(vortexN);       // current angle θ
const vRad = new Float32Array(vortexN);       // current radius r
const vYOff = new Float32Array(vortexN);     // vertical offset
const vSpd = new Float32Array(vortexN);       // individual orbital speed multiplier
const vInf = new Float32Array(vortexN);       // individual inflow rate multiplier

const VORTEX_OUT = DISK_OUT * 1.35;           // spawn radius (beyond disk)

function vortexColor(t) {
  // t: 0 = inner (hot, near event horizon), 1 = outer (cool amber)
  return [
    1.0,                        // R: always full
    Math.max(0.35, 0.88 - t * 0.4),  // G: bright → dim
    Math.max(0.08, 0.52 - t * 0.35)   // B: warm → dark
  ];
}

for (let i = 0; i < vortexN; i++) {
  vAng[i] = Math.random() * 6.283;
  vRad[i] = DISK_IN * 0.9 + Math.random() * (VORTEX_OUT - DISK_IN * 0.9);
  vYOff[i] = (Math.random() - 0.5) * 2.5 * (vRad[i] / VORTEX_OUT + 0.3);
  vSpd[i] = 0.75 + Math.random() * 0.5;
  vInf[i] = 0.6 + Math.random() * 0.8;
  vPhase[i] = Math.random() * 6.283;

  vP[i*3]   = Math.cos(vAng[i]) * vRad[i];
  vP[i*3+1] = vYOff[i];
  vP[i*3+2] = Math.sin(vAng[i]) * vRad[i];

  const t = (vRad[i] - DISK_IN) / (VORTEX_OUT - DISK_IN);
  const cc = vortexColor(Math.max(0, Math.min(1, t)));
  vC[i*3] = cc[0]; vC[i*3+1] = cc[1]; vC[i*3+2] = cc[2];
  vS[i] = Math.random() * 1.8 + 0.4;
}
vortexG.setAttribute('position', new THREE.BufferAttribute(vP, 3));
vortexG.setAttribute('aColor', new THREE.BufferAttribute(vC, 3));
vortexG.setAttribute('aSize', new THREE.BufferAttribute(vS, 1));
vortexG.setAttribute('aPhase', new THREE.BufferAttribute(vPhase, 1));

const vortexMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute vec3 aColor; attribute float aSize; attribute float aPhase;
    varying vec3 vC; varying float vTw;
    uniform float uTime;
    void main() {
      vC = aColor;
      vTw = 0.65 + 0.35 * sin(uTime * 2.5 + aPhase);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (240.0 / -mv.z) * vTw;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vC; varying float vTw;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      // Soft glow core + halo
      float core = smoothstep(0.5, 0.0, d);
      float halo = smoothstep(0.5, 0.15, d) * 0.4;
      float a = (core * 0.3 + halo * 0.1) * vTw;
      gl_FragColor = vec4(vC * 0.8, a);
    }
  `,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const vortex = new THREE.Points(vortexG, vortexMat);
vortex.rotation.x = -TILT;
scene.add(vortex);
window._vortex = {
  geo: vortexG, pos: vP, col: vC,
  ang: vAng, rad: vRad, yOff: vYOff, spd: vSpd, inf: vInf,
  n: vortexN, vOut: VORTEX_OUT
};

// ═══════════════════════════════════════════════════════════
//  ANIMATION
// ═══════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x100a05, 0.3));
const clock = new THREE.Clock();
let first = true;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Update uniforms
  if (window._starMat) window._starMat.uniforms.uTime.value = t;
  diskMat.uniforms.uTime.value = t;
  nebulaMat.uniforms.uTime.value = t;
  lensRingMat.uniforms.uTime.value = t;
  photonMat.uniforms.uTime.value = t;
  vortexMat.uniforms.uTime.value = t;

  // Slow disk rotation
  accretionDisk.rotation.z += dt * 0.06;

  // Slight lens ring rotation
  lensRing.rotation.z += dt * 0.02;
  photonRing.rotation.z += dt * 0.03;
  photonRing2.rotation.x += dt * 0.02;

  // ── Nebula vortex update: arms drift inward, winding tighter ──
  // Each particle's angle is recomputed from the log-spiral law every
  // frame, so as radius shrinks the arm wraps more — a draining whirlpool.
  const nb = window._nebula;
  if (nb) {
    const pos = nb.geo.attributes.position.array;
    const timePhase = t * 0.05; // very slow global precession
    for (let i = 0; i < nb.n; i++) {
      const i3 = i * 3;
      // Gentle far out, faster near the center (strong drain effect)
      nb.rad[i] -= (1.2 + 7.0 / (nb.rad[i] + 3.0)) * dt * 0.55;
      if (nb.rad[i] < DISK_IN * 0.9) {
        // Rebirth across a WIDE outer band (not a thin rim) so the cloud
        // never piles up into a hard, flickering edge ring.
        nb.rad[i] = NEBULA_IN + (0.4 + 0.6 * Math.random()) * (NEBULA_OUT - NEBULA_IN);
        nb.arm[i] = Math.floor(Math.random() * NEBULA_ARMS);
        const jitScale = 0.20 + 0.14 * (nb.rad[i] / NEBULA_OUT);
        nb.jit[i] = gauss(jitScale);
      }
      // Funnel thickness: pinched near center, wide outside
      const thick = 1.2 + (nb.rad[i] / NEBULA_OUT) * 3.6;
      const angle = nebulaAngle(nb.rad[i], nb.arm[i], nb.jit[i], timePhase);
      pos[i3]   = Math.cos(angle) * nb.rad[i];
      pos[i3+1] = nb.y0[i] * thick * 0.5;
      pos[i3+2] = Math.sin(angle) * nb.rad[i];
    }
    nb.geo.attributes.position.needsUpdate = true;
  }

  // ── Vortex particle update: Keplerian spiral inflow ──
  // Each particle orbits at ω = K / r^1.5 (inner = much faster)
  // and slowly spirals inward, accelerating near the event horizon.
  const vx = window._vortex;
  if (vx) {
    const pos = vx.geo.attributes.position.array;
    const col = vx.geo.attributes.aColor.array;
    for (let i = 0; i < vx.n; i++) {
      const i3 = i * 3;
      const r = vx.rad[i];

      // Orbital angular velocity (Keplerian): inner particles whip around fast
      const omega = 4.0 / Math.pow(r / DISK_IN + 0.1, 1.4) * vx.spd[i];
      vx.ang[i] += omega * dt;

      // Inflow rate: gentle far away, dramatic near the center
      // Creates the "drain" vortex — material accelerates as it falls in
      const inflowRate = 1.8 * vx.inf[i] * (1.0 + 12.0 / (r + 3));
      vx.rad[i] -= inflowRate * dt;

      // Vertical compression toward equatorial plane (stronger when closer)
      const vCompress = 3.0 / (r / DISK_IN + 0.3);
      vx.yOff[i] *= Math.max(0, 1.0 - dt * vCompress * 0.4);

      // Recompute Cartesian position from (angle, radius)
      const ca = Math.cos(vx.ang[i]), sa = Math.sin(vx.ang[i]);
      pos[i3]   = ca * vx.rad[i];
      pos[i3+1] = vx.yOff[i];
      pos[i3+2] = sa * vx.rad[i];

      // Update color: hotter/brighter as particle approaches center
      const tt = Math.max(0, Math.min(1, (vx.rad[i] - DISK_IN) / (vx.vOut - DISK_IN)));
      col[i3]   = 1.0;
      col[i3+1] = Math.max(0.35, 0.88 - tt * 0.4);
      col[i3+2] = Math.max(0.08, 0.52 - tt * 0.35);

      // Respawn at outer edge when consumed by the black hole
      if (vx.rad[i] < BH_R * 1.12) {
        vx.ang[i] = Math.random() * 6.283;
        vx.rad[i] = vx.vOut * (0.8 + Math.random() * 0.2);
        vx.yOff[i] = (Math.random() - 0.5) * 2.5;
        vx.spd[i] = 0.75 + Math.random() * 0.5;
        vx.inf[i] = 0.6 + Math.random() * 0.8;
      }
    }
    vx.geo.attributes.position.needsUpdate = true;
    vx.geo.attributes.aColor.needsUpdate = true;
  }

  controls.update();
  composer.render();

  if (first) {
    first = false;
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      window._moduleLoaded = true;
    }, 400);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
