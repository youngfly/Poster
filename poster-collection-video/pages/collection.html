/* ============================================
   Poster Collection Video — Brand CSS
   暗色画廊: 深邃背景、纯白文字、微妙动画
   ============================================ */

:root {
  /* ── Color System ── */
  --color-primary: #E8E0D4;
  --color-primary-light: #F0EBE0;
  --color-primary-lighter: #F7F4EF;
  --color-primary-lightest: #FAF8F4;
  --color-primary-dark: #B0A898;
  --color-primary-darker: #8B8478;
  --color-primary-darkest: #5C5850;

  /* ── Semantic / State Colors ── */
  --state-success: #6AAF6A;
  --state-warning: #D4AD4E;
  --state-error: #C46868;
  --state-info: #6A9FBF;

  /* ── Surface Palette (Dark Gallery) ── */
  --color-bg-main: #0A0A0A;
  --color-bg-secondary: #141414;
  --color-bg-tertiary: #1E1E1E;
  --color-bg-elevated: #111111;
  --color-bg-overlay: rgba(0, 0, 0, 0.8);

  /* ── Accent ── */
  --color-accent: #D4AD4E;
  --color-accent-light: #E8CFA0;
  --color-accent-dark: #A07B28;

  /* ── Text Palette ── */
  --color-text-primary: #F0EBE0;
  --color-text-secondary: #B0A898;
  --color-text-tertiary: #6B6860;
  --color-text-inverse: #0A0A0A;
  --color-text-link: #D4AD4E;

  /* ── Border Palette ── */
  --color-border: #2A2A2A;
  --color-border-subtle: #1E1E1E;
  --color-border-strong: #D4AD4E;

  /* ── Typography ── */
  --font-family-display: "Playfair Display", "Noto Serif SC", Georgia, serif;
  --font-family-body: "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-md: 1.125rem;
  --font-size-lg: 1.25rem;
  --font-size-xl: 1.5rem;
  --font-size-2xl: 2rem;
  --font-size-3xl: 2.5rem;
  --font-size-4xl: 3.25rem;
  --font-size-5xl: 4.5rem;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.2;
  --line-height-snug: 1.35;
  --line-height-normal: 1.6;
  --line-height-relaxed: 1.8;
  --line-height-loose: 2.0;

  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0em;
  --letter-spacing-wide: 0.08em;
  --letter-spacing-wider: 0.15em;
  --letter-spacing-widest: 0.25em;

  /* ── Spacing ── */
  --space-0: 0;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-8: 3rem;
  --space-10: 4rem;
  --space-12: 6rem;
  --space-16: 8rem;

  /* ── Radius ── */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-normal: 300ms ease;
  --transition-slow: 500ms ease;
}

/* ── Light Mode (inverted — rare usage) ── */
html:not(.dark) {
  --color-bg-main: #0A0A0A;
  --color-bg-secondary: #141414;
  --color-bg-tertiary: #1E1E1E;
  --color-bg-elevated: #111111;
  --color-text-primary: #F0EBE0;
  --color-text-secondary: #B0A898;
}

  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

        <button class="dot" data-index="3" style="width: 10px; height: 10px; border-radius: 50%; background: rgba(240,235,224,0.3); border: none; cursor: pointer; transition: all 0.3s ease;"></button>

    <!-- Custom styles (must be in body, not head) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      @keyframes kenburns {
        from { transform: scale(1.0) translate(0, 0); }
        to { transform: scale(1.05) translate(-1%, -0.5%); }
      }

      .kenburns {
        animation: kenburns 20s ease-in-out infinite alternate;
      }

      @media (prefers-reduced-motion: reduce) {
        .kenburns {
          animation: none;
        }
        .slide {
          transition: opacity 0.01s !important;
        }
      }
    </style>

    <!-- Slideshow JavaScript -->
    <script>
      (function() {
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const progressBar = document.getElementById('progress-bar');
        const currentNum = document.getElementById('current-num');
        const playPauseBtn = document.getElementById('play-pause');

        let current = 0;
        let playing = true;
        let interval;

        function showSlide(n) {
          slides.forEach(function(s, i) {
            s.style.opacity = i === n ? '1' : '0';
            s.style.zIndex = i === n ? '1' : '0';
          });
          dots.forEach(function(d, i) {
            if (i === n) {
              d.style.background = 'var(--color-accent)';
              d.style.transform = 'scale(1.3)';
              d.classList.add('active');
            } else {
              d.style.background = 'rgba(240,235,224,0.3)';
              d.style.transform = 'scale(1)';
              d.classList.remove('active');
            }
          });
          currentNum.textContent = String(n + 1).padStart(2, '0');
          // Reset progress bar
          progressBar.style.transition = 'none';
          progressBar.style.width = '0%';
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              progressBar.style.transition = 'width 5s linear';
              progressBar.style.width = '100%';
            });
          });
        }

        function nextSlide() {
          current = (current + 1) % slides.length;
          showSlide(current);
        }

        function startAutoPlay() {
          stopAutoPlay();
          interval = setInterval(nextSlide, 5000);
        }

        function stopAutoPlay() {
          if (interval) {
            clearInterval(interval);
            interval = undefined;
          }
        }

        // Navigation dots click
        dots.forEach(function(dot, i) {
          dot.addEventListener('click', function() {
            stopAutoPlay();
            current = i;
            showSlide(current);
            if (playing) startAutoPlay();
          });
        });

        // Play/Pause
        playPauseBtn.addEventListener('click', function() {
          playing = !playing;
          if (playing) {
            playPauseBtn.innerHTML = '&#10074;&#10074;';
            startAutoPlay();
            progressBar.style.transition = 'width 5s linear';
            progressBar.style.width = '100%';
          } else {
            playPauseBtn.innerHTML = '&#9654;';
            stopAutoPlay();
            progressBar.style.transition = 'none';
          }
        });

        // Init
        showSlide(0);
        startAutoPlay();
      })();
    </script>

    <script>lucide.createIcons();</script>
